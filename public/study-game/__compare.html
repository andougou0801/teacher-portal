<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>カタカナ 見くらべ（使いすて）</title>
<style>
  body { margin: 0; background: #fff; font-family: sans-serif; }
  .row { display: flex; align-items: center; border-bottom: 1px solid #bbb; }
  .cap { position: absolute; font-size: 12px; color: #c00; margin: 2px; }
  .mine, .font { width: 176px; height: 176px; position: relative; }
  .font { font-size: 160px; line-height: 176px; text-align: center;
          font-family: "Yu Gothic", Meiryo, sans-serif; }
  svg { width: 176px; height: 176px; display: block; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
import { KATAKANA_STROKES } from "./js/katakana-strokes.js";

function smoothPath(points) {
  if (!points.length) return "";
  if (points.length === 1) return `M${points[0].x} ${points[0].y}`;
  let d = `M${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length; i++) {
    const prev = points[i - 1];
    const p = points[i];
    d += `Q${prev.x} ${prev.y} ${(prev.x + p.x) / 2} ${(prev.y + p.y) / 2}`;
  }
  const last = points[points.length - 1];
  d += `L${last.x} ${last.y}`;
  return d;
}

const order = [..."アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン"];
const out = document.getElementById("out");
out.innerHTML = order.map((c) => {
  const data = KATAKANA_STROKES[c];
  const paths = data.strokes
    .map((s) => `<path d="${smoothPath(s)}" fill="none" stroke="#222" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>`)
    .join("");
  return `<div class="row">
    <div class="mine"><span class="cap">${c} ${data.strokes.length}画</span>
      <svg viewBox="0 0 100 100">
        <path d="M50 4V96M4 50H96" stroke="#eee" stroke-width="1"/>
        ${paths}
      </svg></div>
    <div class="font">${c}</div>
  </div>`;
}).join("");
</script>
</body>
</html>
