<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>g2 見くらべ（使いすて）</title>
<style>
  body { background:#FDF6E8; color:#2B2A28; font-family:system-ui,sans-serif; margin:20px; }
  h2 { margin:28px 0 8px; border-bottom:2px solid #2B2A28; }
  .row { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start; }
  .cell { background:#fff; border:2px solid #2B2A28; border-radius:10px; padding:6px; text-align:center; }
  .cell b { display:block; font-size:13px; margin-bottom:2px; }
  .cell span { display:block; font-size:11px; color:#666; }
  .small .cell { padding:4px; }
  .pair { display:flex; gap:10px; background:#F4EADA; border:2px dashed #2B2A28; border-radius:12px; padding:8px; margin:0 10px 10px 0; }
  .pair .cell { border-width:1px; }
  .lbl { font-size:12px; writing-mode:vertical-rl; }
</style>
</head>
<body>
<h1>2年 1学期 もやもや 8体（使いすて検証）</h1>
<div id="out"></div>

<script type="module">
import { moyaArtG2, MOYA_ORDER_G2, MOYA_ART_G2 } from "./js/moya-art-g2.js";
import { moyaArt, MOYA_ART } from "./js/moya-art.js";
import { moyaArtM2, MOYA_ART_M2 } from "./js/moya-art-m2.js";
import { moyaArtM3, MOYA_ART_M3 } from "./js/moya-art-m3.js";

const out = document.getElementById("out");
const h = (t) => { const e = document.createElement("h2"); e.textContent = t; out.appendChild(e); };
const row = (cls) => { const e = document.createElement("div"); e.className = "row " + (cls||""); out.appendChild(e); return e; };

function cell(name, note, svg) {
  const d = document.createElement("div");
  d.className = "cell";
  d.innerHTML = `<b>${name}</b>${svg}<span>${note||""}</span>`;
  return d;
}

/* 1. 8体 × 3 mood を 180px */
for (const id of MOYA_ORDER_G2) {
  const a = MOYA_ART_G2[id];
  h(`${a.unit} ${a.name}（${id}）`);
  const r = row();
  for (const mood of ["normal", "hurt", "friend"]) {
    r.appendChild(cell(mood, "", moyaArtG2(id, mood, 180)));
  }
  const note = document.createElement("div");
  note.style.cssText = "flex:1;min-width:240px;font-size:13px;line-height:1.7";
  note.textContent = a.note;
  r.appendChild(note);
}

/* 2. 48px の 小さい表示（ずかん） */
h("48px（ずかんの 大きさ）normal / friend");
const sr = row("small");
for (const id of MOYA_ORDER_G2) {
  sr.appendChild(cell(MOYA_ART_G2[id].name, "normal", moyaArtG2(id, "normal", 48)));
}
const sr2 = row("small");
for (const id of MOYA_ORDER_G2) {
  sr2.appendChild(cell(MOYA_ART_G2[id].name, "friend", moyaArtG2(id, "friend", 48)));
}

/* 3. 似た名前の 既存の子と ならべた 見くらべ */
const FROM = {
  nagasamoya: [moyaArt, MOYA_ART],
  kasamoya: [moyaArt, MOYA_ART],
  hyakumoya: [moyaArtM3, MOYA_ART_M3],
  zumoya: [moyaArtM3, MOYA_ART_M3],
  matomemoya: [moyaArtM3, MOYA_ART_M3],
  ookazumoya: [moyaArtM2, MOYA_ART_M2],
  kuriagarimoya: [moyaArtM2, MOYA_ART_M2],
  kurisagarimoya: [moyaArtM2, MOYA_ART_M2],
};
const PAIRS = [
  ["monosashimoya", ["nagasamoya"]],
  ["masumoya", ["kasamoya"]],
  ["senmoya", ["hyakumoya", "ookazumoya"]],
  ["hissanmoya", ["kuriagarimoya"]],
  ["kurisagemoya", ["kurisagarimoya", "kuriagarimoya"]],
  ["sakamoya", ["zumoya"]],
  ["kufumoya", ["matomemoya"]],
];

for (const size of [140, 48]) {
  h(`見くらべ（${size}px）： 新しい子 ↔ 名前の にた 既存の子`);
  const r = row();
  for (const [mine, others] of PAIRS) {
    const box = document.createElement("div");
    box.className = "pair";
    box.appendChild(cell("★" + MOYA_ART_G2[mine].name, mine, moyaArtG2(mine, "normal", size)));
    for (const o of others) {
      const [fn, tbl] = FROM[o];
      box.appendChild(cell(tbl[o].name, o, fn(o, "normal", size)));
    }
    r.appendChild(box);
  }
}
</script>
</body>
</html>
