<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>tiles かくにん</title>
<style>
  body { background:#FFFDF6; font-family:sans-serif; margin:4px; }
  .grid { display:flex; flex-wrap:wrap; gap:4px; }
  .box { border:1px solid #ccc; padding:2px; background:#fff; width:113px; }
  .box svg { max-width:111px; height:auto; }
  .cap { font-size:11px; color:#333; white-space:pre; }
</style>
</head>
<body>
<div class="grid" id="out"></div>
<script type="module">
import { renderFigure } from "./js/figure.js";
const list = [
  [["a"], "a / 1まい"],
  [["b"], "b / 1まい"],
  [["c"], "c / 1まい"],
  [["d"], "d / 1まい"],
  [["bc"], "bc / 2 ▽"],
  [["da"], "da / 2 △"],
  [["a","c"], "a,c / 2 ▷"],
  [["d","b"], "d,b / 2 ◁"],
  [["ba"], "ba / 2 へいこう"],
  [["dc"], "dc / 2 へいこう"],
  [["a","b"], "a,b たて / 2"],
  [["da","c."], "da,c. / 3"],
  [["da",".b"], "da,.b / 3"],
  [["da","bc"], "da,bc / 4 ◇"],
  [["bc","da"], "bc,da / 4 ちょうむすび"],
  [["dada"], "dada / 4"],
  [["bcbc"], "bcbc / 4"],
  [["bc","bc"], "bc,bc / 4"],
  [["da","da"], "da,da / 4"],
  [["dad","bcb"], "dad,bcb / 6"],
  [["da","bc","da"], "da,bc,da / 6"],
  [["dada","bcbc"], "dada,bcbc / 8"],
  [["da","bc","bc"], "da,bc,bc / 6"],
  [["daa","bc."], "daa,bc. / 5"],
  [["da.","bcb"], "da.,bcb / 5"],
  [["1"], "1 / しかく"],
  [["11"], "11 / ながしかく"],
  [["1.",".."], "1. / あな"],
  [["c"], "c だけ（はんぶん）"],
  [["cb"], "cb（うえ はんぶん）"],
  [["ca"], "ca"],
  [["1a"], "1a"],
  [["b1"], "b1"],
  [["b1",".b"], "b1,.b / おおきい さんかく"],
  [["11","11"], "11,11 / おおきい しかく"],
  [["1","1"], "1,1 たて ながしかく"],
  [["d.","b."], "d.,b. / 2 ◁ あなあり"],
  [["da","b."], "da,b. / 3"],
  [["dc","bc"], "dc,bc"],
  [["ad","bc"], "ad,bc"],
];
const out = document.getElementById("out");
for (const [pattern, cap] of list) {
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = renderFigure({ kind:"tiles", pattern, color:"#F2B23C" }) +
    `<div class="cap">${cap}</div>`;
  out.appendChild(box);
}
</script>
</body>
</html>
