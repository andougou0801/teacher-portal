<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>jp3 みため かくにん</title>
<style>
  body { background:#FFF8EC; font-family: sans-serif; margin:8px; }
  h2 { font-size:13px; margin:10px 0 4px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end; }
  .cell { background:#fff; border:2px solid #2B2A28; border-radius:8px; padding:2px; text-align:center; }
  .cap { font-size:10px; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
import { moyaArtJp3, MOYA_ORDER_JP3, MOYA_ART_JP3 } from "./js/moya-art-jp3.js";
import { moyaArtM3 } from "./js/moya-art-m3.js";

const out = document.getElementById("out");
function section(title, html) {
  out.insertAdjacentHTML("beforeend", `<h2>${title}</h2><div class="row">${html}</div>`);
}

const big = Number(new URLSearchParams(location.search).get("big") || 0);
if (big) {
  const id = new URLSearchParams(location.search).get("id");
  let h = "";
  for (const mood of ["normal", "hurt", "friend"]) {
    h += `<div class="cell">${moyaArtJp3(id, mood, big)}<div class="cap">${mood}</div></div>`;
  }
  section(id, h);
} else {
  for (const id of MOYA_ORDER_JP3) {
    const a = MOYA_ART_JP3[id];
    let h = "";
    for (const mood of ["normal", "hurt", "friend"]) {
      h += `<div class="cell">${moyaArtJp3(id, mood, 112)}<div class="cap">${mood}</div></div>`;
    }
    section(`${a.unit} ${id}（${a.name}）`, h);
  }

  let s = "";
  for (const id of MOYA_ORDER_JP3) {
    s += `<div class="cell">${moyaArtJp3(id, "normal", 48)}</div>`;
  }
  section("48px ちいさい ひょうじ", s);

  section(
    "sotsumoya と matomemoya",
    `<div class="cell">${moyaArtM3("matomemoya", "normal", 112)}<div class="cap">matome</div></div>` +
      `<div class="cell">${moyaArtJp3("sotsumoya", "normal", 112)}<div class="cap">sotsu</div></div>` +
      `<div class="cell">${moyaArtM3("matomemoya", "normal", 48)}<div class="cap">48</div></div>` +
      `<div class="cell">${moyaArtJp3("sotsumoya", "normal", 48)}<div class="cap">48</div></div>`,
  );

  section(
    "tsunagi と kurabe と asobi と keta",
    `<div class="cell">${moyaArtJp3("tsunagimoya", "normal", 112)}<div class="cap">tsunagi</div></div>` +
      `<div class="cell">${moyaArtJp3("kurabemoya", "normal", 112)}<div class="cap">kurabe</div></div>` +
      `<div class="cell">${moyaArtJp3("asobimoya", "normal", 112)}<div class="cap">asobi</div></div>` +
      `<div class="cell">${moyaArtM3("ketamoya", "normal", 112)}<div class="cap">keta</div></div>` +
      `<div class="cell">${moyaArtJp3("tsunagimoya", "normal", 48)}</div>` +
      `<div class="cell">${moyaArtJp3("kurabemoya", "normal", 48)}</div>` +
      `<div class="cell">${moyaArtJp3("asobimoya", "normal", 48)}</div>` +
      `<div class="cell">${moyaArtM3("ketamoya", "normal", 48)}</div>`,
  );
}
</script>
</body>
</html>
