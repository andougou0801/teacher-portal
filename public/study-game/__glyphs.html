<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>カタカナ字形しらべ（使いすて）</title>
<style>
  body { margin: 0; background: #fff; font-family: sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); }
  .cell { border: 1px solid #ccc; text-align: center; position: relative; }
  .g { font-size: 150px; line-height: 1.0; font-family: "Yu Gothic", "Meiryo", sans-serif; }
  .n { position: absolute; left: 2px; top: 2px; font-size: 13px; color: #c00; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
  const chars = [..."アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン"];
  document.getElementById("g").innerHTML = chars
    .map((c, i) => `<div class="cell"><span class="n">${i + 1}</span><div class="g">${c}</div></div>`)
    .join("");
</script>
</body>
</html>
