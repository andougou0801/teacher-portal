<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jp2 もやもや 見た目チェック（使いすて）</title>
    <style>
      body {
        background: #fdf6e8;
        color: #2b2a28;
        font-family: sans-serif;
        margin: 16px;
      }
      table {
        border-collapse: collapse;
      }
      td,
      th {
        border: 1px solid #ccc;
        padding: 4px;
        text-align: center;
        vertical-align: middle;
      }
      .small {
        background: #fff;
      }
      h2 {
        margin: 24px 0 8px;
      }
      .old {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .old div {
        text-align: center;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <h1>こくご2学期 8体</h1>
    <table id="t">
      <tr>
        <th>id</th>
        <th>normal</th>
        <th>hurt</th>
        <th>friend</th>
        <th class="small">48 normal</th>
        <th class="small">48 friend</th>
      </tr>
    </table>
    <h2>既存31体（かぶり確認用・48px）</h2>
    <div class="old" id="old"></div>
    <script type="module">
      import { MOYA_ART_JP2, MOYA_ORDER_JP2, moyaArtJp2 } from "./js/moya-art-jp2.js";
      import { MOYA_ORDER, moyaArt } from "./js/moya-art.js";
      import { MOYA_ORDER_JP, moyaArtJp } from "./js/moya-art-jp.js";
      import { MOYA_ORDER_M2, moyaArtM2 } from "./js/moya-art-m2.js";
      import { MOYA_ORDER_M3, moyaArtM3 } from "./js/moya-art-m3.js";

      const t = document.getElementById("t");
      for (const id of MOYA_ORDER_JP2) {
        const a = MOYA_ART_JP2[id];
        const tr = document.createElement("tr");
        tr.innerHTML =
          `<td>${id}<br>${a.name}<br>${a.unit}</td>` +
          `<td>${moyaArtJp2(id, "normal", 150)}</td>` +
          `<td>${moyaArtJp2(id, "hurt", 150)}</td>` +
          `<td>${moyaArtJp2(id, "friend", 150)}</td>` +
          `<td class="small">${moyaArtJp2(id, "normal", 48)}</td>` +
          `<td class="small">${moyaArtJp2(id, "friend", 48)}</td>`;
        t.appendChild(tr);
      }

      const old = document.getElementById("old");
      const sets = [
        [MOYA_ORDER, moyaArt],
        [MOYA_ORDER_JP, moyaArtJp],
        [MOYA_ORDER_M2, moyaArtM2],
        [MOYA_ORDER_M3, moyaArtM3],
      ];
      for (const [order, fn] of sets) {
        for (const id of order) {
          const d = document.createElement("div");
          d.innerHTML = fn(id, "normal", 48) + "<br>" + id;
          old.appendChild(d);
        }
      }
    </script>
  </body>
</html>
