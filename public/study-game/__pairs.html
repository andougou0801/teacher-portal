<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>まちがえやすい組（使いすて）</title>
<style>
  body { margin: 0; background: #fff; font-family: sans-serif; }
  .pair { border-bottom: 2px solid #333; }
  .line { display: flex; }
  .cell { width: 124px; height: 124px; position: relative; }
  .cap { position: absolute; font-size: 11px; color: #c00; margin: 1px; }
  .font { font-size: 112px; line-height: 124px; text-align: center;
          font-family: "Yu Gothic", Meiryo, sans-serif; }
  svg { width: 124px; height: 124px; display: block; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
import { KATAKANA_STROKES } from "./js/katakana-strokes.js";

function smoothPath(points) {
  let d = `M${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length; i++) {
    const prev = points[i - 1];
    const p = points[i];
    d += `Q${prev.x} ${prev.y} ${(prev.x + p.x) / 2} ${(prev.y + p.y) / 2}`;
  }
  const last = points[points.length - 1];
  return d + `L${last.x} ${last.y}`;
}
const mine = (c) => `<div class="cell"><span class="cap">${c}</span><svg viewBox="0 0 100 100">${
  KATAKANA_STROKES[c].strokes
    .map((s) => `<path d="${smoothPath(s)}" fill="none" stroke="#222" stroke-width="8"
      stroke-linecap="round" stroke-linejoin="round"/>`).join("")}</svg></div>`;
const font = (c) => `<div class="cell font">${c}</div>`;

const groups = ["ソン", "シツ", "クタ", "スヌ", "ワウフ", "マア", "ロ口", "ヌス", "ンソ"];
document.getElementById("out").innerHTML = groups.map((g) => {
  const cs = [...g].filter((c) => KATAKANA_STROKES[c]);
  return `<div class="pair">
    <div class="line">${cs.map(mine).join("")}</div>
    <div class="line">${[...g].map(font).join("")}</div>
  </div>`;
}).join("");
</script>
</body>
</html>
