<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>m3 みため かくにん（つかいすて）</title>
<style>
  body { background:#FFFDF6; font-family:system-ui, sans-serif; margin:16px; color:#2B2A28; }
  h2 { font-size:16px; margin:20px 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .cell { background:#fff; border:2px solid #2B2A28; border-radius:10px; padding:4px; text-align:center; width:132px; }
  .cell b { display:block; font-size:12px; }
  .cell small { display:block; font-size:10px; color:#6a665f; }
  .big { width:200px; }
  .big svg { width:200px; height:200px; }
</style>
</head>
<body>
<div id="out">よみこみ中…</div>
<script type="module">
import { building, moya } from "./js/icons.js";
import { BUILDING_ART_M3 } from "./js/building-art-m3.js";
import { MOYA_ORDER_M3, MOYA_ART_M3 } from "./js/moya-art-m3.js";

const out = document.getElementById("out");
let h = "<h2>たてもの 6棟（色は 6しょくを じゅんに）</h2><div class='row'>";
Object.keys(BUILDING_ART_M3).forEach((k, i) => {
  h += `<div class="cell big">${building(k, i, 200)}<b>${k}</b></div>`;
});
h += "</div>";
for (const id of MOYA_ORDER_M3) {
  const a = MOYA_ART_M3[id];
  h += `<h2>${a.name}（${id} / ${a.unit}）<small>${a.note}</small></h2><div class='row'>`;
  for (const mood of ["normal", "hurt", "friend"]) {
    h += `<div class="cell big">${moya(id, mood, 200)}<b>${mood}</b></div>`;
  }
  h += "</div>";
}
out.innerHTML = h;
</script>
</body>
</html>
