<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字れんしゅう</title>
<style>
  :root{
    --accent:#2d6cdf;
    --accent-dark:#1f54b8;
    --good:#2ecc71;
    --good-dark:#1e9e56;
    --soft:#ff9f43;
    --soft-dark:#e08329;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(180deg,#fff9ec 0%, #eef3fb 100%);
    color:#2a2a2a;
    min-height:100vh;
    padding:16px 12px 44px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:520px;width:100%;margin:0 auto;}
  h1{
    text-align:center;
    font-size:26px;
    color:var(--accent-dark);
    margin:6px 0 14px;
  }
  .card{
    background:#fff;
    border-radius:24px;
    padding:22px 18px;
    box-shadow:0 4px 18px rgba(30,50,90,0.10);
    margin-bottom:16px;
    position:relative;
  }
  .privacy-note{
    text-align:center;
    font-size:11px;
    color:#9aa2b2;
    margin:0 4px 10px;
    line-height:1.6;
  }
  button{font-family:inherit;border:none;cursor:pointer;}

  /* ---- sound toggle ---- */
  .sound-btn{
    position:absolute;
    top:16px;
    right:16px;
    background:#f4f7fc;
    border-radius:50%;
    width:42px;
    height:42px;
    font-size:19px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---- start screen ---- */
  .lead{
    text-align:center;
    font-size:15px;
    color:#5a6376;
    margin:0 0 18px;
    font-weight:700;
  }
  .section-label{
    font-size:13px;
    font-weight:800;
    color:#8a93a3;
    margin:0 0 8px 2px;
  }
  .mode-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    background:#f4f7fc;
    border:3px solid transparent;
    border-radius:18px;
    padding:14px 16px;
    margin-bottom:12px;
    text-align:left;
  }
  .mode-btn.active{border-color:var(--accent);background:#eaf1ff;}
  .mode-icon{font-size:32px;flex-shrink:0;}
  .mode-title{font-size:18px;font-weight:800;color:#2a2a2a;}
  .mode-sub{font-size:12px;color:#7a8296;margin-top:3px;}
  .count-row{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .mode-empty-note{
    font-size:13px;
    color:#8a6a2a;
    background:#fff8ec;
    border:2px dashed #f5a623;
    border-radius:12px;
    padding:10px 14px;
    margin:0 0 20px;
    line-height:1.7;
  }
  .grade-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:20px;
  }
  .grade-btn{
    background:#f4f7fc;
    border:3px solid transparent;
    border-radius:16px;
    padding:14px 4px;
    font-size:16px;
    font-weight:800;
    color:#3a4152;
  }
  .grade-btn.active{border-color:var(--accent);background:#eaf1ff;color:var(--accent-dark);}
  .count-btn{
    flex:1;
    background:#f4f7fc;
    border:3px solid transparent;
    border-radius:16px;
    padding:14px 4px;
    font-size:16px;
    font-weight:800;
    color:#3a4152;
  }
  .count-btn.active{border-color:var(--accent);background:#eaf1ff;color:var(--accent-dark);}
  .btn-main{
    display:block;
    width:100%;
    background:var(--accent);
    color:#fff;
    font-size:22px;
    font-weight:800;
    padding:18px 40px;
    border-radius:20px;
    box-shadow:0 4px 10px rgba(45,108,223,0.32);
  }
  .btn-main:active{transform:scale(0.98);}
  .best-streak{
    text-align:center;
    font-size:13px;
    color:#8a93a3;
    margin-top:14px;
    font-weight:700;
  }

  /* ---- game screen ---- */
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    font-weight:800;
    color:var(--accent-dark);
    margin-bottom:10px;
  }
  .streak-pill{
    background:#fff2e0;
    color:var(--soft-dark);
    border-radius:999px;
    padding:4px 12px;
    font-size:13px;
  }
  .quit-btn{
    background:none;
    color:#b7bec9;
    font-size:13px;
    font-weight:700;
    padding:4px 6px;
  }
  .progress-outer{
    height:14px;
    border-radius:8px;
    background:#eef1f6;
    overflow:hidden;
    margin-bottom:20px;
  }
  .progress-inner{
    height:100%;
    background:var(--good);
    border-radius:8px;
    transition:width .35s ease;
  }
  .q-card{
    text-align:center;
    padding:18px 6px 6px;
  }
  .q-instr{
    font-size:14px;
    font-weight:800;
    color:#8a93a3;
    margin:0 0 10px;
  }
  .q-word{
    font-size:clamp(56px,18vw,96px);
    font-weight:700;
    color:#2a2a2a;
    line-height:1.1;
    margin:6px 0;
  }
  .q-yomi{
    font-size:clamp(34px,10vw,48px);
    font-weight:800;
    color:var(--accent-dark);
    line-height:1.2;
    margin:6px 0;
  }
  .q-hint{
    font-size:16px;
    color:#7a8296;
    margin:4px 0 6px;
    min-height:22px;
  }
  .hint-btn{
    background:#f4f7fc;
    color:#5a6376;
    font-size:13px;
    font-weight:700;
    padding:8px 16px;
    border-radius:14px;
    margin:6px auto 4px;
    display:inline-block;
  }
  .answer-input{
    width:100%;
    font-size:30px;
    text-align:center;
    padding:14px 10px;
    border-radius:16px;
    border:3px solid #d8dfea;
    font-family:inherit;
    margin:14px 0;
  }
  .answer-input:focus{outline:none;border-color:var(--accent);}
  .choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin:16px 0 4px;
  }
  .choice-btn{
    background:#f4f7fc;
    border:4px solid transparent;
    border-radius:20px;
    font-size:clamp(40px,13vw,64px);
    font-weight:700;
    padding:18px 4px;
    color:#2a2a2a;
    position:relative;
  }
  /* 色の見分けがつきにくい子でも判断できるよう、正誤は色だけでなく
     アイコン（丸／バツ）でも示す。 */
  .choice-btn.correct,
  .choice-btn.wrong{
    position:relative;
  }
  .choice-btn.correct::after,
  .choice-btn.wrong::after{
    position:absolute;
    top:4px;
    right:10px;
    font-size:20px;
    line-height:1;
  }
  .choice-btn.correct{background:var(--good);border-color:var(--good-dark);color:#fff;}
  .choice-btn.correct::after{content:"⭕";}
  .choice-btn.wrong{background:var(--soft);border-color:var(--soft-dark);color:#fff;}
  .choice-btn.wrong::after{content:"✕";}
  .choice-btn[disabled]{opacity:1;}
  .q-yomi-sub{
    font-size:20px;
    font-weight:800;
    color:var(--accent-dark);
    margin:0 0 6px;
  }
  .reveal-btn{
    display:block;
    width:100%;
    background:var(--accent);
    color:#fff;
    font-size:18px;
    font-weight:800;
    padding:16px 30px;
    border-radius:18px;
    margin-top:10px;
    box-shadow:0 4px 10px rgba(45,108,223,0.28);
  }
  .write-answer{
    text-align:center;
    margin-top:8px;
  }
  .write-answer .q-word{margin-bottom:2px;}
  .self-check-row{
    display:flex;
    gap:12px;
    margin-top:16px;
  }
  .self-btn{
    flex:1;
    border-radius:18px;
    font-size:18px;
    font-weight:800;
    padding:16px 8px;
    border:4px solid transparent;
  }
  .self-btn.wrong{background:#fff2e0;color:var(--soft-dark);border-color:#ffdca8;}
  .self-btn.correct{background:#e8f9ee;color:var(--good-dark);border-color:#b9ecc9;}
  .feedback{
    min-height:40px;
    font-size:19px;
    font-weight:800;
    margin:10px 0 4px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .feedback.good{color:var(--good-dark);}
  .feedback.soft{color:var(--soft-dark);}
  .q-example{
    font-size:15px;
    color:#5a6376;
    background:#f4f7fc;
    border-radius:12px;
    padding:10px 14px;
    margin:0 0 10px;
    line-height:1.5;
  }
  .next-btn{
    display:block;
    width:100%;
    background:var(--accent);
    color:#fff;
    font-size:18px;
    font-weight:800;
    padding:14px 30px;
    border-radius:16px;
    margin-top:6px;
  }

  /* ---- result screen ---- */
  .result-emoji{font-size:64px;text-align:center;margin:4px 0 6px;}
  .result-title{font-size:22px;font-weight:800;text-align:center;color:var(--accent-dark);margin:0 0 18px;}
  .stat-line{
    display:flex;
    justify-content:space-between;
    font-size:15px;
    font-weight:700;
    color:#3a4152;
    padding:10px 4px;
    border-bottom:1px dashed #eef1f6;
  }
  .stat-line span:last-child{color:var(--accent-dark);}
  .record-badge{
    text-align:center;
    background:#fff2e0;
    color:var(--soft-dark);
    font-weight:800;
    font-size:14px;
    border-radius:14px;
    padding:10px;
    margin:14px 0;
  }
  .result-btn-row{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .result-btn-row .btn-main{font-size:16px;padding:14px 10px;}
  .btn-ghost{
    flex:1;
    background:#f4f7fc;
    color:#3a4152;
    font-size:16px;
    font-weight:800;
    padding:14px 10px;
    border-radius:20px;
  }

  /* ---- milestone overlay ---- */
  #milestoneOverlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:50;
    opacity:0;
  }
  #milestoneOverlay.show{
    animation:milestonePop 1.3s ease forwards;
  }
  .milestone-box{
    background:rgba(45,108,223,0.94);
    color:#fff;
    font-size:22px;
    font-weight:800;
    padding:20px 34px;
    border-radius:24px;
    text-align:center;
    box-shadow:0 8px 24px rgba(30,50,90,0.3);
  }
  @keyframes milestonePop{
    0%{opacity:0;transform:scale(0.7);}
    15%{opacity:1;transform:scale(1.05);}
    25%{transform:scale(1);}
    80%{opacity:1;}
    100%{opacity:0;}
  }

  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🈶 かんじれんしゅう</h1>

  <!-- ============ START SCREEN ============ -->
  <div class="card" id="startScreen">
    <button class="sound-btn" id="soundBtn">🔊</button>
    <p class="lead" id="leadText">かんじで あそぼう！</p>

    <p class="section-label">なんねんせいの かんじ？</p>
    <div class="grade-row" id="gradeRow"></div>

    <p class="section-label">あそびかたを えらんでね</p>
    <button class="mode-btn active" id="modeSelectBtn" data-mode="select">
      <span class="mode-icon">👆</span>
      <span>
        <span class="mode-title">かんじを えらぶ</span><br>
        <span class="mode-sub">よみを みて、あう かんじを タップ</span>
      </span>
    </button>
    <button class="mode-btn" id="modeYomiBtn" data-mode="yomi">
      <span class="mode-icon">✏️</span>
      <span>
        <span class="mode-title">よみを かく</span><br>
        <span class="mode-sub">かんじを みて、よみを にゅうりょく</span>
      </span>
    </button>
    <button class="mode-btn" id="modeWriteBtn" data-mode="write">
      <span class="mode-icon">📓</span>
      <span>
        <span class="mode-title">ノートに かく</span><br>
        <span class="mode-sub">よみを みて、かんじを ノートに かく→じぶんで こたえあわせ</span>
      </span>
    </button>
    <button class="mode-btn" id="modeOkuriganaBtn" data-mode="okurigana">
      <span class="mode-icon">🖊️</span>
      <span>
        <span class="mode-title">おくりがな クイズ</span><br>
        <span class="mode-sub">正しい おくりがなは どっちかな？（例：帰る／帰える）</span>
      </span>
    </button>
    <button class="mode-btn" id="modeHomophoneBtn" data-mode="homophone">
      <span class="mode-icon">🔀</span>
      <span>
        <span class="mode-title">にたかんじ クイズ</span><br>
        <span class="mode-sub">同じ読みで ちがう かんじを えらぶ</span>
      </span>
    </button>

    <p class="section-label">なんもん やる？</p>
    <div class="count-row" id="countRow"></div>

    <button class="btn-main" id="startBtn">▶ はじめる</button>
    <p class="best-streak" id="bestStreakLine"></p>
  </div>

  <p class="privacy-note">この学習きろくは、この端末（たんまつ）の中だけに ほぞんされます。外部への送信は ありません。</p>

  <!-- ============ GAME SCREEN ============ -->
  <div class="card hidden" id="gameScreen">
    <div class="top-row">
      <span id="streakPillWrap"><span class="streak-pill" id="streakPill" style="display:none;">🔥 <span id="streakNum">0</span></span></span>
      <span>できた <span id="correctNum">0</span></span>
      <button class="quit-btn" id="quitBtn">やめる</button>
    </div>
    <div class="progress-outer"><div class="progress-inner" id="progressInner" style="width:0%;"></div></div>

    <div class="q-card">
      <p class="q-instr" id="qInstr"></p>
      <div id="qPromptArea"></div>
      <p class="q-hint" id="qHint"></p>
      <button class="hint-btn hidden" id="hintBtn">💡 ヒント</button>

      <div id="yomiInputArea" class="hidden">
        <input type="text" id="answerInput" class="answer-input" placeholder="ひらがなで こたえてね" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="btn-main" id="answerBtn">こたえる</button>
      </div>

      <div id="choiceArea" class="choice-grid hidden"></div>

      <div id="writeRevealArea" class="hidden">
        <button class="reveal-btn" id="revealBtn">こたえを みる</button>
      </div>
      <div id="writeAnswerArea" class="write-answer hidden">
        <div class="q-word" id="writeAnswerChar"></div>
        <p class="q-yomi-sub" id="writeAnswerCaption"></p>
        <div class="self-check-row">
          <button class="self-btn wrong" id="selfWrongBtn">🌱 もうすこし</button>
          <button class="self-btn correct" id="selfCorrectBtn">⭕ できた</button>
        </div>
      </div>

      <p class="feedback" id="feedback"></p>
      <p class="q-example hidden" id="qExample"></p>
      <button class="next-btn hidden" id="nextBtn">つぎへ ▶</button>
    </div>
  </div>

  <!-- ============ RESULT SCREEN ============ -->
  <div class="card hidden" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <p class="result-title" id="resultTitle">よくがんばったね！</p>
    <div class="stat-line"><span>できた かんじ</span><span id="statMastered"></span></div>
    <div class="stat-line"><span>1かいで できた</span><span id="statFirstTry"></span></div>
    <div class="stat-line"><span>さいこう れんぞく</span><span id="statBestStreak"></span></div>
    <p class="record-badge hidden" id="recordBadge">🏆 あたらしい きろく！</p>
    <div class="result-btn-row">
      <button class="btn-ghost" id="backBtn">さいしょから</button>
      <button class="btn-main" id="retryBtn">もういちど</button>
    </div>
  </div>
</div>

<div id="milestoneOverlay"><div class="milestone-box" id="milestoneBox"></div></div>

<script>
  /* =========================================================
     学年別 漢字データ
     出典：漢字テスト作成.html（kanji-test-maker.html）の
     GRADE_KANJI と同一データ（文部科学省の学年別漢字配当表を
     もとに検証済み）をそのまま流用しています。誤りが再混入
     しないよう、値はここで再入力せず、検証済みデータを
     コピーしたものです。学年を追加するときは、漢字テスト作成
     側と同じ内容をここにも同じ形で追加してください。
     ========================================================= */
  const GRADE_KANJI = [
    { grade: 1, label: '1年生', kanji: [
["一","一つ","ひとつ","「1」のかず","りんごが ひとつ あります。","一番","いちばん","さいしょ、または いちばんめの こと"],
["右","右","みぎ","みぎての ほう","本を 右に おきます。","","",""],
["雨","雨","あめ","そらから ふる みず","そらから 雨が ふって きます。","","",""],
["円","円","えん","おかねの たんい（1円、10円など）","ジュースは 100円です。","","",""],
["王","王","おう","おうさまの こと","王さまが おしろに います。","","",""],
["音","音","おと","みみで きこえる もの","とりの なく 音が きこえます。","音楽","おんがく","うたや がっきを たのしむ こと"],
["下","下","した","したの ほう","つくえの 下に ねこが います。","下校","げこう","がっこうから いえに かえる こと"],
["火","火","ひ","もえて あつい もの","火が あかく もえています。","火曜日","かようび","1しゅうかんの なかの ある ひ（げつようびの つぎ）"],
["花","花","はな","さく きれいな もの","にわに きれいな 花が さいています。","","",""],
["貝","貝","かい","うみに いる いきもの","うみで 貝を ひろいました。","","",""],
["学","学校","がっこう","べんきょうを する ところ","まいにち 学校へ いきます。","学ぶ","まなぶ","べんきょうする こと"],
["気","気","き","きもちの こと","きょうは 気を つけて あるきます。","","",""],
["九","九つ","ここのつ","「9」のかず","りんごが 九つ あります。","九月","くがつ","1ねんの なかの つき（はちがつの つぎ）"],
["休","休む","やすむ","やすみを とること","かぜで がっこうを 休みます。","","",""],
["玉","玉","たま","まるい かたちの もの","きれいな 玉を みつけました。","","",""],
["金","お金","おかね","かいものに つかう もの","お金で おかしを かいます。","金曜日","きんようび","1しゅうかんの なかの ある ひ（もくようびの つぎ）"],
["空","空","そら","うえに ひろがる ところ","空に 白い くもが あります。","空気","くうき","わたしたちが すって いきを する もの"],
["月","月","つき","よるに でる まるい もの","よるに 月が きれいに ひかります。","月曜日","げつようび","1しゅうかんの はじめの ひ"],
["犬","犬","いぬ","わんわんと なく どうぶつ","こうえんで 犬と あそびます。","","",""],
["見","見る","みる","めで みること","とりが とぶのを 見ました。","見学","けんがく","ばしょに いって、じっさいに みて まなぶ こと"],
["五","五つ","いつつ","「5」のかず","いちごが 五つ あります。","五月","ごがつ","1ねんの なかの つき（しがつの つぎ）"],
["口","口","くち","たべたり はなしたり する ところ","口を おおきく あけます。","","",""],
["校","小学校","しょうがっこう","1ねんせいが かよう がっこう","小学校で べんきょうします。","","",""],
["左","左","ひだり","ひだりての ほう","本を 左に おきます。","左右","さゆう","みぎと ひだりの こと"],
["三","三つ","みっつ","「3」のかず","けしゴムが 三つ あります。","三月","さんがつ","1ねんの なかの つき（にがつの つぎ）"],
["山","山","やま","たかく なっている ところ","たかい 山に のぼります。","","",""],
["子","子","こ","こどもの こと","ねこの 子が うまれました。","帽子","ぼうし","あたまに かぶる もの"],
["四","四つ","よっつ","「4」のかず","みかんが 四つ あります。","四月","しがつ","1ねんの なかの つき（さんがつの つぎ）"],
["糸","糸","いと","ぬうときに つかう ほそい もの","はりに 糸を とおします。","","",""],
["字","文字","もじ","かいた もの","ノートに 文字を かきます。","","",""],

  function kanjiRowsOf(grade){
    const g = GRADE_KANJI.find(x => x.grade === grade);
    return g ? g.kanji : [];
  }
  // row = [char, word, yomi, hint, example, word2, yomi2, hint2]
  // example / word2・yomi2・hint2（音訓もう一方の読み）は無ければ空文字。
  // 古い4列だけの行（row[4]以降が undefined）でも壊れないよう '' にフォールバックする。
  function entriesOf(grade){
    return kanjiRowsOf(grade).map(row => ({
      char: row[0], word: row[1], yomi: row[2], hint: row[3],
      example: row[4] || '',
      word2: row[5] || '', yomi2: row[6] || '', hint2: row[7] || ''
    }));
  }
  // 熟語の主な読みと、存在すればもう一方の音訓の読みから、その回に出題する
  // 「読みのバリエーション」をランダムに選ぶ。存在しなければ常に主な読みになる。
  function pickReadingVariant(entry){
    if(entry.word2 && Math.random() < 0.5){
      return { char: entry.char, word: entry.word2, yomi: entry.yomi2, hint: entry.hint2, example: entry.example };
    }
    return { char: entry.char, word: entry.word, yomi: entry.yomi, hint: entry.hint, example: entry.example };
  }

  /* ---------- 送り仮名クイズ用データ ----------
     正しい表記(entry.word)から、「送り仮名の開始位置を1文字前にずらした」
     典型的なまちがい（例：帰る→帰える、楽しい→楽のしい）を機械的に作る。
     これは実際の学校でよく取り上げられる送り仮名のまちがいのパターンと一致する。
     数字＋「つ」（一つ・二つ…）は読み方が不規則な特別枠なので対象外にする。 */
  const OKURIGANA_EXCLUDE_CHARS = new Set(['一','二','三','四','五','六','七','八','九','十']);
  function okuriganaInfo(entry){
    const char = entry.char, word = entry.word, yomi = entry.yomi;
    if(OKURIGANA_EXCLUDE_CHARS.has(char) && word.endsWith('つ')) return null;
    const chars = [...word];
    if(chars.length < 2 || chars[0] !== char) return null;
    const suffix = chars.slice(1).join('');
    if(![...suffix].every(ch => /[ぁ-ん]/.test(ch))) return null;
    if(!yomi || !yomi.endsWith(suffix)) return null;
    const kanjiReadingPart = yomi.slice(0, yomi.length - suffix.length);
    if(kanjiReadingPart.length < 2) return null;
    const wrongWord = char + kanjiReadingPart.slice(-1) + suffix;
    if(wrongWord === word) return null;
    return { correctWord: word, wrongWord, hint: entry.hint, example: entry.example, yomi };
  }

  /* ---------- 同じ読み・ちがう漢字クイズ用データ ----------
     全学年ぶんの単語を読み（yomi）でグループ化し、同じ読みで書き表し方（word）が
     2つ以上ある組み合わせ（同訓異字・同音異義語）を集める。学年をまたぐ組み合わせも
     あるため、出題時は「選んだ学年以下」の相手だけを選択肢に使う。 */
  const HOMOPHONE_GROUPS = (function(){
    const byYomi = new Map();
    GRADE_KANJI.forEach(g => {
      entriesOf(g.grade).forEach(entry => {
        const variants = [{ word: entry.word, yomi: entry.yomi, hint: entry.hint, example: entry.example }];
        if(entry.word2){
          variants.push({ word: entry.word2, yomi: entry.yomi2, hint: entry.hint2, example: entry.example });
        }
        variants.forEach(v => {
          if(!v.yomi) return;
          if(!byYomi.has(v.yomi)) byYomi.set(v.yomi, []);
          byYomi.get(v.yomi).push({ char: entry.char, word: v.word, hint: v.hint, example: v.example, grade: g.grade });
        });
      });
    });
    const groups = new Map();
    byYomi.forEach((list, yomi) => {
      const seenWords = new Map();
      list.forEach(x => { if(!seenWords.has(x.word)) seenWords.set(x.word, x); });
      const uniqueList = Array.from(seenWords.values());
      if(uniqueList.length >= 2) groups.set(yomi, uniqueList);
    });
    return groups;
  })();

  // entry（そのグレードの1字）を「正解」とみなし、既に習っている（＝選んだ学年以下の）
  // 同じ読みの仲間が2つ以上（自分を含めて）あれば、その一覧を返す。無ければnull。
  function homophoneCandidatesFor(entry, maxGrade){
    const group = HOMOPHONE_GROUPS.get(entry.yomi);
    if(!group) return null;
    const filtered = group.filter(m => m.grade <= maxGrade);
    if(filtered.length < 2) return null;
    if(!filtered.some(m => m.word === entry.word)) return null;
    return filtered;
  }

  }

  /* ---------- utilities ---------- */
  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function toHiragana(s){
    return String(s || '').replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  }
  function normalizeAnswer(s){
    return toHiragana(String(s || '')).trim().replace(/\s+/g, '');
  }

  let sharedCtx = null;
  function beep(freq, duration, delay, vol){
    if(!soundEnabled) return;
    try{
      if(!sharedCtx) sharedCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = sharedCtx;
      const start = ctx.currentTime + (delay || 0) / 1000;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(vol || 0.13, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + duration / 1000);
      osc.start(start);
      osc.stop(start + duration / 1000);
    }catch(e){ /* audio not available; fail silently */ }
  }
  function playCorrect(){ beep(880, 120, 0); beep(1175, 160, 90); }
  function playWrong(){ beep(320, 260, 0, 0.09); }
  function playMilestone(){ beep(660, 110, 0); beep(880, 110, 100); beep(1175, 220, 200); }
  function playComplete(){ beep(660, 130, 0); beep(880, 130, 120); beep(1046, 130, 240); beep(1318, 260, 360); }

  /* ---------- best streak（学年ごとに local only で保存） ---------- */
  function bestKeyFor(grade){ return 'kanji-practice-best-streak-v1-g' + grade; }
  function getBestStreak(grade){ return Number(localStorage.getItem(bestKeyFor(grade))) || 0; }

  /* ---------- start screen controls ---------- */

  function countOptionsFor(total){
    if(total <= 0) return [];
    return [...new Set([10, 20, total].filter(n => n <= total))];
  }

  // 「おくりがなクイズ」「にたかんじクイズ」は、その学年・条件に合う字だけを
  // 出題対象にする（通常モードは学年の全字が対象）。
  function poolIndicesForMode(m){
    const all = ENTRIES.map((_, i) => i);
    if(m === 'okurigana'){
      return all.filter(i => !!okuriganaInfo(ENTRIES[i]));
    }
    if(m === 'homophone'){
      return all.filter(i => !!homophoneCandidatesFor(ENTRIES[i], selectedGrade));
    }
    return all;
  }

  function renderCountRow(){
    countRow.innerHTML = '';
    const total = poolIndicesForMode(selectedMode).length;
    const opts = countOptionsFor(total);
    if(opts.length === 0){

    if(!opts.includes(selectedCount)) selectedCount = opts[0];

      b.className = 'count-btn' + (n === selectedCount ? ' active' : '');

      b.addEventListener('click', () => {
        selectedCount = n;

      });
      countRow.appendChild(b);
    });
  }

  /* ---------- game state ---------- */
  let mode, gameGrade, totalOriginal, queue, currentIdx, currentChoices, currentVariant;

  function startGame(m, count){
    mode = m;
    gameGrade = selectedGrade;
    const sourceIndices = poolIndicesForMode(m);
    totalOriginal = Math.min(count, sourceIndices.length);
    queue = shuffle(sourceIndices).slice(0, totalOriginal);
    correctCount = 0;
    streak = 0;
    sessionBestStreak = 0;
    firstTryCorrect = 0;
    missedOnce = new Set();

  function updateTopRow(){
    correctNum.textContent = String(correctCount);
    streakNum.textContent = String(streak);
    streakPill.style.display = streak >= 2 ? 'inline-flex' : 'none';
    const inFlight = (currentIdx !== null && currentIdx !== undefined) ? 1 : 0;
    const doneCount = totalOriginal - (queue.length + inFlight);
    const pct = totalOriginal > 0 ? Math.max(0, Math.min(100, Math.round((doneCount / totalOriginal) * 100))) : 0;
    progressInner.style.width = pct + '%';
  }

  // A few hint strings (e.g. 円="おかねの たんい（1円、10円など）") legitimately contain
  // the target kanji itself. That's fine in yomi-input mode (the kanji is already the
  // prompt there), but in select mode showing it would hand over the answer — mask it.
  function maskHintForSelect(entry){
    if(entry.hint.indexOf(entry.char) === -1) return entry.hint;
    return entry.hint.split(entry.char).join('〇');
  }

  function pickDistractors(excludeIdx, n){
    const pool = ENTRIES.map((_, i) => i).filter(i => i !== excludeIdx);
    return shuffle(pool).slice(0, n);
  }

  // 2文字以上の熟語（例：絶対／ぜったい）の場合、対象の1字だけを「？」に置き換えて
  // 単語のかたちを見せる（＋よみを小さく添える）ことで、「読みは分かるが選択肢が
  // 1文字なので何を答えればいいのか分からない」という食い違いを防ぐ。1文字の
  // 単語（1年生に多い）は、元のとおり よみだけを大きく見せる。
  function appendWordPrompt(entry){
    const chars = [...entry.word];
    if(chars.length > 1){
      const masked = chars.map(ch => ch === entry.char ? '？' : ch).join('');
      const wordEl = document.createElement('div');
      wordEl.className = 'q-word';
      wordEl.textContent = masked;
      qPromptArea.appendChild(wordEl);
      const yomiEl = document.createElement('div');
      yomiEl.className = 'q-yomi-sub';
      yomiEl.textContent = entry.yomi;
      qPromptArea.appendChild(yomiEl);
    } else {
      const yomiEl = document.createElement('div');
      yomiEl.className = 'q-yomi';
      yomiEl.textContent = entry.yomi;
      qPromptArea.appendChild(yomiEl);
    }
  }

  function hideAllAnswerAreas(){
    yomiInputArea.classList.add('hidden');
    choiceArea.classList.add('hidden');
    choiceArea.innerHTML = '';
    writeRevealArea.classList.add('hidden');
    writeAnswerArea.classList.add('hidden');
  }

  function nextQuestion(){
    awaitingNext = false;
    feedback.textContent = '';
    feedback.className = 'feedback';
    qExample.classList.add('hidden');
    qExample.textContent = '';
    nextBtn.classList.add('hidden');
    hintBtn.classList.add('hidden');
    hintBtn.textContent = '💡 ヒント';
    qHint.textContent = '';
    qHint.dataset.revealed = '';
    hideAllAnswerAreas();

    if(queue.length === 0){
      finishGame();
      return;
    }
    currentIdx = queue.shift();
    updateTopRow();
    const entry = ENTRIES[currentIdx];
    // 音読み／訓読みの両方が登録されている字は、出題のたびにどちらかを
    // ランダムに選ぶ（片方しか無い字は常にそちらになる）。
    currentVariant = pickReadingVariant(entry);
    const variant = currentVariant;

    if(mode === 'yomi'){
      qInstr.textContent = 'よみを ひらがなで かいてね';
      qPromptArea.innerHTML = '';
      const wordEl = document.createElement('div');
      wordEl.className = 'q-word';
      wordEl.textContent = variant.word;
      qPromptArea.appendChild(wordEl);
      yomiInputArea.classList.remove('hidden');
      answerInput.value = '';
      answerInput.disabled = false;
      answerBtn.disabled = false;
      hintBtn.classList.remove('hidden');
      hintBtn.onclick = () => {
        qHint.textContent = variant.hint;
      };
      setTimeout(() => answerInput.focus(), 30);
    } else if(mode === 'write'){
      qInstr.textContent = 'かんじを ノートに かいてみよう';
      qPromptArea.innerHTML = '';
      appendWordPrompt(variant);
      // ここでの課題は「よみからかんじを書く」ことなので、選択モードと同じく
      // ヒントに答えの漢字そのものが混ざらないようマスクする（かんじが既に
      // 見えているyomiモードとは違い、ここでは見せてはいけない）。
      hintBtn.classList.remove('hidden');
      hintBtn.onclick = () => {
        qHint.textContent = maskHintForSelect(variant);
      };
      writeRevealArea.classList.remove('hidden');
      revealBtn.onclick = () => {
        writeRevealArea.classList.add('hidden');
        writeAnswerArea.classList.remove('hidden');
        writeAnswerChar.textContent = entry.char;
        let caption = entry.word + '（' + entry.yomi + '）';
        if(entry.word2){
          caption += '　／　' + entry.word2 + '（' + entry.yomi2 + '）';
        }
        writeAnswerCaption.textContent = caption;
      };
      selfWrongBtn.onclick = () => afterAnswer(false, variant);
      selfCorrectBtn.onclick = () => afterAnswer(true, variant);
    } else if(mode === 'okurigana'){
      const info = okuriganaInfo(entry);
      currentVariant = { char: entry.char, word: info.correctWord, yomi: info.yomi, hint: info.hint, example: info.example };
      qInstr.textContent = 'おくりがなが ただしいのは どっち？';
      qPromptArea.innerHTML = '';
      const hintEl = document.createElement('div');
      hintEl.className = 'q-yomi-sub';
      hintEl.textContent = info.hint;
      qPromptArea.appendChild(hintEl);
      choiceArea.classList.remove('hidden');
      const opts = shuffle([info.correctWord, info.wrongWord]);
      opts.forEach(text => {
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.textContent = text;
        b.addEventListener('click', () => handleGenericChoiceClick(text === info.correctWord, b, info.correctWord));
        choiceArea.appendChild(b);
      });
    } else if(mode === 'homophone'){
      const candidates = homophoneCandidatesFor(entry, gameGrade);
      const correctMember = candidates.find(m => m.word === entry.word) || candidates[0];
      const wrongPool = candidates.filter(m => m.word !== correctMember.word);
      const distractorCount = Math.min(3, wrongPool.length);
      const distractors = shuffle(wrongPool).slice(0, distractorCount);
      currentVariant = { char: correctMember.char, word: correctMember.word, yomi: entry.yomi, hint: correctMember.hint, example: correctMember.example };

      qInstr.textContent = 'この ぶんに あう かんじことばは どれ？';
      qPromptArea.innerHTML = '';
      const exampleText = correctMember.example || entry.example || '';
      const sentenceEl = document.createElement('div');
      sentenceEl.className = 'q-yomi-sub';
      if(exampleText && exampleText.includes(correctMember.word)){
        sentenceEl.textContent = exampleText.split(correctMember.word).join('（　　　　）');
      } else {
        sentenceEl.textContent = '（' + (correctMember.hint || '') + '）';
      }
      qPromptArea.appendChild(sentenceEl);
      const readingEl = document.createElement('div');
      readingEl.className = 'q-yomi';
      readingEl.textContent = entry.yomi;
      qPromptArea.appendChild(readingEl);

      choiceArea.classList.remove('hidden');
      const opts = shuffle([correctMember, ...distractors]);
      opts.forEach(m => {
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.textContent = m.word;
        b.addEventListener('click', () => handleGenericChoiceClick(m.word === correctMember.word, b, correctMember.word));
        choiceArea.appendChild(b);
      });
    } else {
      qInstr.textContent = [...variant.word].length > 1
        ? '？に はいる かんじは どれかな？'
        : 'この よみかたの かんじは どれかな？';
      qPromptArea.innerHTML = '';
      appendWordPrompt(variant);
      qHint.textContent = maskHintForSelect(variant);
      choiceArea.classList.remove('hidden');

      const distractors = pickDistractors(currentIdx, 3);
      currentChoices = shuffle([currentIdx, ...distractors]);
      currentChoices.forEach(idx => {
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.textContent = ENTRIES[idx].char;
        b.addEventListener('click', () => handleChoiceClick(idx, b));
        choiceArea.appendChild(b);
      });
    }
  }

  function requeueWrong(idx){
    const insertAt = Math.min(queue.length, 2 + Math.floor(Math.random() * 3));
    queue.splice(insertAt, 0, idx);
  }

  function afterAnswer(isCorrect, variant){
    if(isCorrect){
      correctCount++;
      streak++;
      if(streak > sessionBestStreak) sessionBestStreak = streak;
      if(!missedOnce.has(currentIdx)) firstTryCorrect++;
      feedback.className = 'feedback good';
      feedback.textContent = '⭕ せいかい！';
      playCorrect();
      if(streak > 0 && streak % 5 === 0) showMilestone(streak + 'れんぞく せいかい！🎉');
    } else {
      missedOnce.add(currentIdx);
      streak = 0;
      requeueWrong(currentIdx);
      feedback.className = 'feedback soft';
      const answerDisplay = mode === 'yomi' ? variant.yomi
        : (mode === 'okurigana' || mode === 'homophone') ? variant.word
        : variant.char;
      feedback.textContent = '🌱 おしい！ こたえは「' + answerDisplay + '」';
      playWrong();
    }
    if(variant.example){
      qExample.textContent = '📖 ' + variant.example;
      qExample.classList.remove('hidden');
    }
    updateTopRow();
    nextBtn.classList.remove('hidden');
    awaitingNext = true;
    // 次へボタンにフォーカスを移すと、キーボードで進めたい子が毎回マウス/タップに
    // 持ち替えなくても Enter（または Space）でそのまま次の問題に進められる。
    nextBtn.focus();
  }

  function submitYomiAnswer(){
    if(awaitingNext) return;
    answerInput.disabled = true;
    answerBtn.disabled = true;
    const isCorrect = normalizeAnswer(answerInput.value) === normalizeAnswer(currentVariant.yomi);
    afterAnswer(isCorrect, currentVariant);
  }
  answerBtn.addEventListener('click', submitYomiAnswer);
  // isComposing のチェックは、ローマ字入力などIMEで変換確定のためにEnterを押した
  // タイミングで、まだ確定していない文字列のまま誤って答え合わせしてしまうのを防ぐため。
  answerInput.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing) submitYomiAnswer(); });

  function handleChoiceClick(idx, btnEl){
    if(awaitingNext) return;
    const buttons = Array.from(choiceArea.children);
    buttons.forEach(b => b.disabled = true);
    const isCorrect = idx === currentIdx;
    if(isCorrect){
      btnEl.classList.add('correct');
    } else {
      btnEl.classList.add('wrong');
      const correctBtn = buttons[currentChoices.indexOf(currentIdx)];
      if(correctBtn) correctBtn.classList.add('correct');
    }
    afterAnswer(isCorrect, currentVariant);
  }

  // おくりがなクイズ・にたかんじクイズ用の選択肢クリック処理（正解の文字列で判定する）。
  function handleGenericChoiceClick(isCorrect, btnEl, correctText){
    if(awaitingNext) return;
    const buttons = Array.from(choiceArea.children);
    buttons.forEach(b => b.disabled = true);
    if(isCorrect){
      btnEl.classList.add('correct');
    } else {
      btnEl.classList.add('wrong');
      const correctBtn = buttons.find(b => b.textContent === correctText);
      if(correctBtn) correctBtn.classList.add('correct');
    }
    afterAnswer(isCorrect, currentVariant);
  }

  nextBtn.addEventListener('click', nextQuestion);

  function showMilestone(text){
    const overlay = document.getElementById('milestoneOverlay');
    document.getElementById('milestoneBox').textContent = text;
    overlay.classList.remove('show');
    void overlay.offsetWidth;
    overlay.classList.add('show');
    playMilestone();
  }

  /* ---------- result screen ---------- */
  function finishGame(){
    const best = getBestStreak(gameGrade);
    const newRecord = sessionBestStreak > best;
    if(newRecord) setBestStreak(gameGrade, sessionBestStreak);
    playComplete();

    document.getElementById('resultEmoji').textContent = missedOnce.size === 0 ? '🏅' : '🎉';
    document.getElementById('resultTitle').textContent =
      missedOnce.size === 0 ? 'ぜんぶ いっかいで せいかい！すごい！' : 'よくがんばったね！';
    document.getElementById('statMastered').textContent = totalOriginal + 'こ';
    document.getElementById('statFirstTry').textContent = firstTryCorrect + 'こ';
    document.getElementById('statBestStreak').textContent = '🔥 ' + sessionBestStreak;
    document.getElementById('recordBadge').classList.toggle('hidden', !newRecord);

    showScreen(resultScreen);
  }

  document.getElementById('retryBtn').addEventListener('click', () => startGame(mode, totalOriginal));
  document.getElementById('backBtn').addEventListener('click', () => {
    showScreen(startScreen);
    renderBestStreakLine();
  });
</script>
</body>
