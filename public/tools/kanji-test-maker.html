<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>漢字テスト作成</title>
<style>
  :root{
    --accent:#2d6cdf;
    --accent-dark:#1f54b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(180deg,#f4f8ff 0%, #eef3fb 100%);
    color:#2a2a2a;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:640px;width:100%;margin:0 auto;}
  h1{
    text-align:center;
    font-size:20px;
    color:var(--accent-dark);
    margin:6px 0 4px;
  }
  .sub-note{
    text-align:center;
    font-size:11px;
    color:#8a93a3;
    margin:0 0 20px;
  }
  .card{
    background:#fff;
    border-radius:20px;
    padding:22px 20px;
    box-shadow:0 4px 16px rgba(30,50,90,0.08);
    margin-bottom:16px;
  }
  h2{
    font-size:15px;
    color:var(--accent-dark);
    margin:0 0 14px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:#555;
    margin-bottom:6px;
  }
  select, input[type="text"], input[type="number"]{
    padding:8px 10px;
    border-radius:10px;
    border:1px solid #d8dfea;
    font-size:14px;
    font-family:inherit;
  }
  .row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:14px;
  }
  .row > div{flex:1;min-width:150px;}
  .fmt-row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:14px;
    font-size:14px;
  }
  .fmt-row label{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:400;
    color:#2a2a2a;
    margin:0;
  }
  .count-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
  }
  .count-row input[type="number"]{width:80px;}
  button{
    font-family:inherit;
    border:none;
    border-radius:14px;
    cursor:pointer;
  }
  .btn-main{
    display:block;
    width:100%;
    background:var(--accent);
    color:#fff;
    font-size:17px;
    font-weight:800;
    padding:15px 40px;
    box-shadow:0 3px 8px rgba(45,108,223,0.3);
    margin-top:4px;
  }
  .btn-main:active{transform:scale(0.99);}
  .btn-row{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .btn-sub{
    flex:1;
    background:#eef1f6;
    color:#3a4152;
    font-size:13px;
    font-weight:700;
    padding:10px 14px;
  }
  .btn-sub:hover{background:#e3e8f0;}
  .btn-small{
    background:#eef1f6;
    color:#3a4152;
    font-size:12px;
    font-weight:700;
    padding:7px 12px;
    white-space:nowrap;
  }
  .btn-small:hover{background:#e3e8f0;}
  .btn-small.active{background:var(--accent);color:#fff;}
  .btn-danger{color:#c0392b;}
  .preset-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid #eef1f6;
  }
  .preset-row select,
  .preset-row input[type="text"]{
    flex:1;
    min-width:120px;
  }
  .status-msg{
    font-size:13px;
    color:var(--accent);
    margin-top:8px;
    min-height:16px;
  }
  .status-msg.error{color:#c0392b;}
  .toggle-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:700;
    color:#555;
    margin:10px 0 0;
  }
  .toggle-row input{margin:0;}
  .fontsize-row{
    text-align:center;
    margin-top:10px;
  }
  .fontsize-row label{
    font-weight:700;
    font-size:13px;
    color:#555;
    display:inline-block;
  }

  /* ---- print preview area ---- */
  .preview-wrap{max-width:900px;margin:0 auto;}
  #a4-frame{
    width:210mm;
    aspect-ratio:210/297;
    overflow:hidden;
    box-sizing:border-box;
    padding:16mm 16mm;
    margin:0 auto;
    background:#ffffff;
    border-radius:4px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
    position:relative;
  }
  #print-area{
    width:100%;
    height:100%;
    position:relative;
    box-sizing:border-box;
  }
  .page-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:16px;
    margin-bottom:10px;
  }
  .kaku-sen{
    display:inline-block;
    width:2.2em;
    border-bottom:2px solid #000;
    margin:0 3px;
  }
  .kaku-sen-s{
    display:inline-block;
    width:1.6em;
    border-bottom:2px solid #000;
    margin:0 3px;
  }
  .kaku-sen-l{
    display:inline-block;
    width:5em;
    border-bottom:2px solid #000;
    margin-left:6px;
  }
  #title-hyouji{
    text-align:center;
    font-size:22px;
    border-bottom:3px solid var(--accent);
    padding-bottom:8px;
    margin:0 0 8px;
  }
  #instruction-hyouji{
    font-size:13px;
    color:#444;
    margin:0 0 14px;
  }
  #mondai{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .q-item{
    border-bottom:1px dashed #d8dfea;
    padding-bottom:8px;
  }
  .q-head{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:6px;
  }
  .q-num{
    display:inline-block;
    min-width:1.8em;
    font-weight:700;
  }
  .word-disp{
    font-weight:700;
    margin-right:10px;
  }
  .yomi-blank{
    display:inline-block;
    min-width:7em;
    border-bottom:2px solid #000;
    text-align:center;
    color:var(--accent-dark);
    font-weight:700;
  }
  .q-yomi{
    font-weight:700;
  }
  .q-hint{
    font-size:0.75em;
    color:#777;
  }
  .q-boxes{
    margin-top:6px;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
  }
  .masu{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:1.8em;
    height:1.8em;
    border:2px solid #333;
    position:relative;
    margin:0 2px;
    background:
      linear-gradient(#ccc,#ccc) center / 100% 1px no-repeat,
      linear-gradient(#ccc,#ccc) center / 1px 100% no-repeat;
    background-color:#fff;
    flex-shrink:0;
  }
  .masu-ans{
    color:var(--accent-dark);
    font-weight:700;
    font-size:1em;
  }
  .kana-fixed{
    display:inline-block;
    padding:0 1px;
  }
  .page-footer{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    justify-content:flex-end;
    align-items:baseline;
    font-size:16px;
  }

  @media print{
    .no-print, .fontsize-bar{display:none;}
    body{background:#fff;padding:0;}
    .preview-wrap{max-width:none;}
    #a4-frame{
      width:auto;
      aspect-ratio:auto;
      overflow:visible;
      padding:0;
      margin:0;
      box-shadow:none;
      border-radius:0;
    }
    #print-area{height:auto;}
    .page-footer{position:static;margin-top:16px;}
    #title-hyouji{border-bottom:3px solid #000;}
  }
  @page{
    size:A4;
    margin:15mm;
  }
</style>
</head>
<body>
<div class="wrap no-print">
  <h1>🈁 漢字テスト作成</h1>
  <p class="sub-note">学年・出題形式を選ぶだけで、印刷用の漢字テストと解答を自動作成します。</p>

  <div class="card">
    <h2>1. テストの設定</h2>
    <div class="row">
      <div>
        <label for="gradeSelect">学年</label>
        <select id="gradeSelect" style="width:100%;"></select>
      </div>
      <div>
        <label for="titleInput">タイトル</label>
        <input type="text" id="titleInput" style="width:100%;">
      </div>
    </div>

    <label>出題形式</label>
    <div class="fmt-row">
      <label><input type="radio" name="format" value="yomi" checked> 読み方（漢字 → よみがな）</label>
      <label><input type="radio" name="format" value="kaki"> 書き取り（よみがな → 漢字）</label>
      <label><input type="radio" name="format" value="mix"> ミックス（両方をランダムに）</label>
    </div>

    <label for="countInput">問題数</label>
    <div class="count-row">
      <input type="number" id="countInput" min="1" max="80" value="10">
      <button class="btn-small" data-count="10">10問</button>
      <button class="btn-small" data-count="20">20問</button>
      <button class="btn-small" data-count="80">全問</button>
      <span style="font-size:12px;color:#8a93a3;" id="poolSizeNote"></span>
    </div>

    <button class="btn-main" id="makeBtn">テストを作る</button>
    <div class="toggle-row">
      <input type="checkbox" id="showAnswer">
      <label for="showAnswer" style="margin:0;">解答を表示する（採点用に印刷するときにチェック）</label>
    </div>
    <div class="btn-row">
      <button class="btn-sub" id="printBtn">印刷する</button>
    </div>

    <div class="preset-row">
      <select id="presetSelect"><option value="">保存済み設定を選択…</option></select>
      <input type="text" id="presetNameInput" placeholder="保存名（例: 1学期 読み方10問）">
      <button class="btn-small" id="presetSaveBtn">保存</button>
      <button class="btn-small btn-danger" id="presetDeleteBtn">削除</button>
    </div>
    <p class="status-msg" id="statusMsg"></p>
  </div>
</div>

<div class="preview-wrap">
  <div id="a4-frame">
    <div id="print-area">
      <div class="page-header">
        <div class="hizuke-ran"><span class="kaku-sen-s"></span>年<span class="kaku-sen-s"></span>組<span class="kaku-sen-s"></span>番　名前<span class="kaku-sen-l"></span></div>
      </div>
      <h2 id="title-hyouji"></h2>
      <p id="instruction-hyouji"></p>
      <div id="mondai"></div>
      <div class="page-footer">
        <div class="tensuu-ran"><span class="kaku-sen"></span>点</div>
      </div>
    </div>
  </div>
</div>

<div class="wrap no-print fontsize-bar">
  <div class="card fontsize-row">
    <label for="fontsize">文字の大きさ：</label>
    <input type="range" id="fontsize" min="12" max="26" value="16" oninput="fontSizeUpdate()">
    <span id="fontsize-hyouji">16</span>px
  </div>
</div>

<script>
  /* =========================================================
     学年別 漢字データ
     - 1年生：文部科学省の学年別漢字配当表に基づく「教育漢字」80字。
       読み・例（word）・ヒントは、実際に使われている標準的な語のみを
       採用し、確信が持てないものは掲載していません。
     - 2年生以降を追加するときは、この GRADE_KANJI に
       { grade: 2, label: "2年生", kanji: [...] } の形で
       要素を足すだけで、画面側のロジックはそのまま使えます。
     ========================================================= */
  const GRADE_KANJI = [
    {
      grade: 1,
      label: "1年生",
      kanji: [
        ["一","一つ","ひとつ","「1」のかず"],
        ["右","右","みぎ","みぎての ほう"],
        ["雨","雨","あめ","そらから ふる みず"],
        ["円","円","えん","おかねの たんい（1円、10円など）"],
        ["王","王","おう","おうさまの こと"],
        ["音","音","おと","みみで きこえる もの"],
        ["下","下","した","したの ほう"],
        ["火","火","ひ","もえて あつい もの"],
        ["花","花","はな","さく きれいな もの"],
        ["貝","貝","かい","うみに いる いきもの"],
        ["学","学校","がっこう","べんきょうを する ところ"],
        ["気","気","き","きもちの こと"],
        ["九","九つ","ここのつ","「9」のかず"],
        ["休","休む","やすむ","やすみを とること"],
        ["玉","玉","たま","まるい かたちの もの"],
        ["金","お金","おかね","かいものに つかう もの"],
        ["空","空","そら","うえに ひろがる ところ"],
        ["月","月","つき","よるに でる まるい もの"],
        ["犬","犬","いぬ","わんわんと なく どうぶつ"],
        ["見","見る","みる","めで みること"],
        ["五","五つ","いつつ","「5」のかず"],
        ["口","口","くち","たべたり はなしたり する ところ"],
        ["校","小学校","しょうがっこう","1ねんせいが かよう がっこう"],
        ["左","左","ひだり","ひだりての ほう"],
        ["三","三つ","みっつ","「3」のかず"],
        ["山","山","やま","たかく なっている ところ"],
        ["子","子","こ","こどもの こと"],
        ["四","四つ","よっつ","「4」のかず"],
        ["糸","糸","いと","ぬうときに つかう ほそい もの"],
        ["字","文字","もじ","かいた もの"],
        ["耳","耳","みみ","おとを きく ところ"],
        ["七","七つ","ななつ","「7」のかず"],
        ["車","車","くるま","はしる のりもの"],
        ["手","手","て","ものを もつ ところ"],
        ["十","十","とお","「10」のかず"],
        ["出","出る","でる","そとへ いくこと"],
        ["女","女の子","おんなのこ","おんなの こども"],
        ["小","小さい","ちいさい","サイズが ちいさいこと"],
        ["上","上","うえ","うえの ほう"],
        ["森","森","もり","きが たくさん あるところ"],
        ["人","人","ひと","ひとの こと"],
        ["水","水","みず","のむ つめたい もの"],
        ["正","正しい","ただしい","まちがって いないこと"],
        ["生","生まれる","うまれる","あかちゃんが うまれること"],
        ["青","青い","あおい","そらの ような いろ"],
        ["夕","夕日","ゆうひ","ゆうがたの たいよう"],
        ["石","石","いし","かたい もの"],
        ["赤","赤い","あかい","りんごの ような いろ"],
        ["千","千","せん","「1000」のかず"],
        ["川","川","かわ","みずが ながれる ところ"],
        ["先","先生","せんせい","おしえて くれる ひと"],
        ["早","早い","はやい","じかんが はやいこと"],
        ["草","草","くさ","にわに はえる みどりの もの"],
        ["足","足","あし","あるくときに つかう ところ"],
        ["村","村","むら","ひとが すんでいる ところ"],
        ["大","大きい","おおきい","サイズが おおきいこと"],
        ["男","男の子","おとこのこ","おとこの こども"],
        ["竹","竹","たけ","まっすぐ のびる しょくぶつ"],
        ["中","中","なか","まんなかの ほう"],
        ["虫","虫","むし","ちいさい いきもの"],
        ["町","町","まち","ひとが おおい ところ"],
        ["天","天気","てんき","そらの ようす"],
        ["田","田","た","おこめを つくる ところ"],
        ["土","土","つち","じめんの こと"],
        ["二","二つ","ふたつ","「2」のかず"],
        ["日","日","ひ","たいようの こと"],
        ["入","入る","はいる","なかに いくこと"],
        ["年","年","とし","1ねんかんの こと"],
        ["白","白い","しろい","ゆきの ような いろ"],
        ["八","八つ","やっつ","「8」のかず"],
        ["百","百","ひゃく","「100」のかず"],
        ["文","文","ぶん","かいた ぶんしょうの こと"],
        ["木","木","き","にわに はえる おおきな しょくぶつ"],
        ["本","本","ほん","よむ もの"],
        ["名","名","な","よびなの こと"],
        ["目","目","め","みるための ところ"],
        ["立","立つ","たつ","たちあがること"],
        ["力","力","ちから","ちからを だすこと"],
        ["林","林","はやし","きが はえている ところ"],
        ["六","六つ","むっつ","「6」のかず"]
      ]
    }
  ];

  function kanjiListOf(grade){
    const g = GRADE_KANJI.find(x => x.grade === grade);
    if(!g) return [];
    return g.kanji.map(row => ({ char: row[0], word: row[1], yomi: row[2], hint: row[3] }));
  }

  const gradeSelect = document.getElementById('gradeSelect');
  const titleInput = document.getElementById('titleInput');
  const countInput = document.getElementById('countInput');
  const makeBtn = document.getElementById('makeBtn');
  const printBtn = document.getElementById('printBtn');
  const showAnswer = document.getElementById('showAnswer');
  const poolSizeNote = document.getElementById('poolSizeNote');
  const presetSelect = document.getElementById('presetSelect');
  const presetNameInput = document.getElementById('presetNameInput');
  const presetSaveBtn = document.getElementById('presetSaveBtn');
  const presetDeleteBtn = document.getElementById('presetDeleteBtn');
  const statusMsg = document.getElementById('statusMsg');

  const PRESET_KEY = 'kanji-test-maker-presets-v1';
  let presets = {};
  let currentQuestions = [];

  function setStatus(msg, isError){
    statusMsg.textContent = msg || '';
    statusMsg.classList.toggle('error', !!isError);
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function initGradeSelect(){
    gradeSelect.innerHTML = '';
    GRADE_KANJI.forEach(g => {
      const opt = document.createElement('option');
      opt.value = String(g.grade);
      opt.textContent = g.label;
      gradeSelect.appendChild(opt);
    });
    updatePoolSizeNote();
    if(!titleInput.value){
      titleInput.value = defaultTitle();
    }
  }

  function currentGrade(){
    return Number(gradeSelect.value) || GRADE_KANJI[0].grade;
  }

  function defaultTitle(){
    const g = GRADE_KANJI.find(x => x.grade === currentGrade());
    return (g ? g.label : '') + ' かんじテスト';
  }

  function updatePoolSizeNote(){
    const n = kanjiListOf(currentGrade()).length;
    poolSizeNote.textContent = '（この学年は全' + n + '問まで作成できます）';
    countInput.max = String(n);
    if(Number(countInput.value) > n) countInput.value = String(n);
  }

  gradeSelect.addEventListener('change', () => {
    updatePoolSizeNote();
    titleInput.value = defaultTitle();
  });

  document.querySelectorAll('[data-count]').forEach(btn => {
    btn.addEventListener('click', () => {
      const n = Number(btn.getAttribute('data-count'));
      const max = Number(countInput.max) || 80;
      countInput.value = String(Math.min(n, max));
    });
  });

  function selectedFormat(){
    const el = document.querySelector('input[name="format"]:checked');
    return el ? el.value : 'yomi';
  }

  function instructionText(format){
    if(format === 'yomi'){
      return '◆　かんじの　よみがなを　（　）に　ひらがなで　かきましょう。';
    }
    if(format === 'kaki'){
      return '◆　（　）の　ひらがなに　あう　かんじを　□に　かきましょう。';
    }
    return '◆　もんだいに　あわせて、よみがな（ひらがな）または　かんじを　かきましょう。';
  }

  function toSegments(word){
    const out = [];
    for(const ch of word){
      const isKanji = /[一-鿿]/.test(ch);
      out.push({ type: isKanji ? 'kanji' : 'kana', text: ch });
    }
    return out;
  }

  function maruSuuji(n){
    if(n >= 1 && n <= 20) return String.fromCharCode(0x2460 + (n - 1));
    if(n >= 21 && n <= 35) return String.fromCharCode(0x3251 + (n - 21));
    if(n >= 36 && n <= 50) return String.fromCharCode(0x32B1 + (n - 36));
    return n + '.';
  }

  function makeTest(){
    const grade = currentGrade();
    const pool = kanjiListOf(grade);
    if(pool.length === 0){
      alert('この学年のデータはまだ準備中です。');
      return;
    }
    const format = selectedFormat();
    let count = Math.floor(Number(countInput.value));
    if(!count || count < 1) count = 1;
    if(count > pool.length) count = pool.length;
    countInput.value = String(count);

    const shuffled = shuffle(pool);
    const chosen = shuffled.slice(0, count);

    currentQuestions = chosen.map(entry => {
      let qType = format;
      if(format === 'mix'){
        qType = Math.random() < 0.5 ? 'yomi' : 'kaki';
      }
      return { entry, qType };
    });

    document.getElementById('title-hyouji').textContent = titleInput.value || defaultTitle();
    document.getElementById('instruction-hyouji').textContent = instructionText(format);
    fontSizeUpdate();
    render();
  }

  function render(){
    const withAns = showAnswer.checked;
    let html = '';

    currentQuestions.forEach((q, i) => {
      const num = maruSuuji(i + 1);
      if(q.qType === 'yomi'){
        html += '<div class="q-item yomi">'
          + '<div class="q-head">'
          + '<span class="q-num">' + num + '</span>'
          + '<span class="word-disp">' + escapeHtml(q.entry.word) + '</span>'
          + '<span class="yomi-blank">' + (withAns ? escapeHtml(q.entry.yomi) : '') + '</span>'
          + '</div></div>';
      } else {
        const segs = toSegments(q.entry.word);
        const boxesHtml = segs.map(seg => {
          if(seg.type === 'kanji'){
            return '<span class="masu">' + (withAns ? '<span class="masu-ans">' + escapeHtml(seg.text) + '</span>' : '') + '</span>';
          }
          return '<span class="kana-fixed">' + escapeHtml(seg.text) + '</span>';
        }).join('');
        html += '<div class="q-item kaki">'
          + '<div class="q-head">'
          + '<span class="q-num">' + num + '</span>'
          + '<span class="q-yomi">' + escapeHtml(q.entry.yomi) + '</span>'
          + '<span class="q-hint">（' + escapeHtml(q.entry.hint) + '）</span>'
          + '</div>'
          + '<div class="q-boxes">' + boxesHtml + '</div>'
          + '</div>';
      }
    });

    document.getElementById('mondai').innerHTML = html || '<p style="color:#8a93a3;font-size:13px;">「テストを作る」を押すと、ここに問題が表示されます。</p>';
  }

  showAnswer.addEventListener('change', render);
  makeBtn.addEventListener('click', makeTest);
  printBtn.addEventListener('click', () => window.print());

  function fontSizeUpdate(){
    const size = document.getElementById('fontsize').value;
    document.getElementById('mondai').style.fontSize = size + 'px';
    document.getElementById('fontsize-hyouji').textContent = size;
  }

  /* ---- presets（テスト設定の保存・読み込み。個人情報は扱いません） ---- */
  function loadPresets(){
    try{
      const raw = localStorage.getItem(PRESET_KEY);
      presets = raw ? (JSON.parse(raw) || {}) : {};
    }catch(e){ presets = {}; }
  }

  function persistPresets(){
    localStorage.setItem(PRESET_KEY, JSON.stringify(presets));
  }

  function renderPresetSelect(selected){
    presetSelect.innerHTML = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '保存済み設定を選択…';
    presetSelect.appendChild(placeholder);
    Object.keys(presets).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      if(name === selected) opt.selected = true;
      presetSelect.appendChild(opt);
    });
  }

  presetSelect.addEventListener('change', () => {
    const name = presetSelect.value;
    if(!name || !presets[name]) return;
    const p = presets[name];
    if(p.grade) gradeSelect.value = String(p.grade);
    updatePoolSizeNote();
    if(p.format){
      const el = document.querySelector('input[name="format"][value="' + p.format + '"]');
      if(el) el.checked = true;
    }
    if(p.count) countInput.value = String(p.count);
    if(p.title) titleInput.value = p.title;
    presetNameInput.value = name;
    setStatus('「' + name + '」を読み込みました', false);
  });

  presetSaveBtn.addEventListener('click', () => {
    const name = presetNameInput.value.trim();
    if(!name){
      setStatus('保存名を入力してください', true);
      return;
    }
    presets[name] = {
      grade: currentGrade(),
      format: selectedFormat(),
      count: Number(countInput.value),
      title: titleInput.value
    };
    persistPresets();
    renderPresetSelect(name);
    setStatus('「' + name + '」として保存しました', false);
  });

  presetDeleteBtn.addEventListener('click', () => {
    const name = presetSelect.value;
    if(!name || !presets[name]) return;
    delete presets[name];
    persistPresets();
    renderPresetSelect('');
    presetNameInput.value = '';
    setStatus('「' + name + '」を削除しました', false);
  });

  initGradeSelect();
  loadPresets();
  renderPresetSelect('');
  makeTest();
</script>
</body>
</html>
