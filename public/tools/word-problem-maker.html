<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>文章問題メーカー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background-color: #f4f6f8;
    color: #333;
    margin: 0;
    padding: 24px;
  }
  .no-print {
    background-color: #ffffff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    max-width: 760px;
    margin: 0 auto 24px auto;
  }
  .no-print h1 {
    color: #2d6cdf;
    font-size: 22px;
    margin-top: 0;
  }
  .no-print label {
    display: block;
    margin-bottom: 14px;
    font-weight: bold;
    font-size: 14px;
    color: #444;
  }
  .no-print input[type="text"],
  .no-print input[type="number"],
  .no-print select {
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    margin-left: 8px;
  }
  .no-print button {
    background-color: #2d6cdf;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    margin-right: 8px;
    margin-top: 8px;
  }
  .no-print button:hover { background-color: #1f54b8; }
  .no-print button.sub-btn {
    background-color: #eef2fb;
    color: #2d6cdf;
    padding: 6px 12px;
    font-size: 12px;
  }
  .no-print button.sub-btn:hover { background-color: #dde6fa; }
  .no-print hr {
    border: none;
    border-top: 1px solid #eee;
    margin: 20px 0;
  }
  .setsumei {
    font-size: 12px;
    color: #888;
    font-weight: normal;
    margin-top: -8px;
    margin-bottom: 14px;
  }
  .overflow-warning {
    font-size: 13px;
    color: #c0392b;
    font-weight: bold;
    background: #fff0f0;
    border: 1px solid #f2c6c6;
    border-radius: 10px;
    padding: 8px 12px;
    margin-top: 14px;
  }
  .grade-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 6px;
  }
  .grade-row label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 0;
    font-weight: normal;
    background: #f4f6f8;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .grade-row input[type="radio"]:checked + span,
  .grade-row label:has(input:checked) {
    color: #2d6cdf;
    font-weight: bold;
  }
  #unit-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
  }
  #unit-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0;
    font-weight: normal;
    font-size: 13px;
    background: #f9fafc;
    padding: 8px 12px;
    border-radius: 8px;
  }
  #unit-list .domain-tag {
    font-size: 11px;
    color: #888;
    background: #eef2fb;
    border-radius: 6px;
    padding: 1px 6px;
    margin-left: auto;
  }
  .input-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    margin-bottom: 14px;
  }
  .input-row label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 0;
    font-weight: bold;
  }
  .fontsize-bar {
    max-width: 210mm;
    margin: 16px auto 0 auto;
    text-align: center;
    background-color: #ffffff;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  .fontsize-bar label {
    font-weight: bold;
    font-size: 14px;
    color: #444;
  }
  #a4-frame {
    width: 210mm;
    aspect-ratio: 210 / 297;
    overflow: hidden;
    box-sizing: border-box;
    padding: 20mm;
    margin: 0 auto;
    background-color: #ffffff;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    position: relative;
  }
  #print-area {
    width: 100%;
    height: 100%;
    position: relative;
    box-sizing: border-box;
    font-size: 15px;
  }
  #title-hyouji {
    text-align: center;
    font-size: 20px;
    border-bottom: 3px solid #2d6cdf;
    padding-bottom: 6px;
    margin-bottom: 6px;
  }
  .name-row {
    display: flex;
    justify-content: flex-end;
    gap: 20px;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .name-row span.uketuke {
    display: inline-block;
    min-width: 6em;
    border-bottom: 1px solid #666;
  }
  .name-row span.uketuke.mijikai {
    min-width: 2.2em;
  }
  #mondai-list { }
  .q-block {
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px dashed #cfd8e8;
  }
  .q-block:last-child { border-bottom: none; }
  .q-text {
    margin: 0 0 3px 0;
    line-height: 1.4;
  }
  .q-num {
    display: inline-block;
    min-width: 1.6em;
    font-weight: bold;
    color: #2d6cdf;
  }
  .q-answer-row {
    margin: 0;
    padding-left: 1.6em;
    line-height: 1.5;
  }
  .blank-line {
    display: inline-block;
    border-bottom: 1.5px solid #666;
    min-height: 1.2em;
    vertical-align: bottom;
    margin: 0 4px;
  }
  .blank-shiki { width: 8em; }
  .blank-kotae { width: 4.5em; }
  .kotae-fill {
    display: inline-block;
    color: #1f54b8;
    font-weight: bold;
    margin: 0 4px;
    border-bottom: 1.5px solid #666;
    text-align: center;
    min-width: 2em;
  }
  .bunsuu {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    line-height: 1.15;
    margin: 0 3px;
    font-size: 0.92em;
  }
  .bunshi { padding: 0 4px; }
  .bunbo { padding: 0 4px; border-top: 1.6px solid #000; }
  .taibunsuu {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    vertical-align: middle;
    margin: 0 2px;
  }

  @media print {
    .no-print, .fontsize-bar { display: none; }
    body { background: #fff; padding: 0; }
    #a4-frame {
      width: auto;
      aspect-ratio: auto;
      height: 257mm;
      overflow: visible;
      padding: 0;
      margin: 0;
      box-shadow: none;
      border-radius: 0;
    }
    #title-hyouji { border-bottom: 3px solid #000; }
  }
  @page { size: A4; margin: 20mm; }
</style>
</head>
<body>
<div class="no-print">
  <h1>文章問題メーカー</h1>
  <p class="setsumei">学年を選ぶと、学習指導要領（算数）に沿った単元が表示されます。単元は複数選べます。選んだ単元からランダムに文章題を自動作成します（外部送信は一切ありません）。</p>

  <label>プリントのタイトル：<input type="text" id="title" value="文章問題プリント" style="width:220px;"></label>

  <label>学年：</label>
  <div class="grade-row" id="grade-row"></div>

  <label style="margin-top:14px;">単元（複数選べます）：
    <button type="button" class="sub-btn" onclick="unitAllToggle(true)">すべて選択</button>
    <button type="button" class="sub-btn" onclick="unitAllToggle(false)">すべて解除</button>
  </label>
  <div id="unit-list"></div>

  <div class="input-row">
    <label>問題数：<input type="number" id="mondaisu" value="10" min="1" max="30" style="width:60px;"></label>
    <label><input type="checkbox" id="showAnswer" onchange="mondaiSaihyouji()"> こたえを表示する（先生用の解答プリントになります）</label>
  </div>

  <button type="button" onclick="mondaiSakusei()">文章題を作成する</button>
  <button type="button" onclick="window.print()">印刷する</button>
  <button type="button" onclick="pdfHozon()">PDFとして保存</button>
  <p class="overflow-warning" id="overflow-warning" style="display:none;">⚠ 問題数または文字の大きさが多く、1ページに収まっていません。問題数を減らすか、文字の大きさを小さくしてください。</p>
</div>

<div class="fontsize-bar">
  <label>文字の大きさ：
    <input type="range" id="fontsize" min="12" max="20" value="15" oninput="fontSizeUpdate()">
    <span id="fontsize-hyouji">15</span>px
  </label>
</div>

<div id="a4-frame">
  <div id="print-area">
    <div id="title-hyouji"></div>
    <div class="name-row">
      <span><span class="uketuke mijikai">&nbsp;</span>年</span>
      <span><span class="uketuke mijikai">&nbsp;</span>組</span>
      <span>名前　<span class="uketuke">&nbsp;</span></span>
    </div>
    <div id="mondai-list"></div>
  </div>
</div>

<script>
/* ===== ユーティリティ ===== */
function ri(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[ri(0, arr.length - 1)]; }
function pickTwoNames() {
  let a = pick(NAMES);
  let b = pick(NAMES);
  let guard = 0;
  while (b === a && guard < 20) { b = pick(NAMES); guard++; }
  return [a, b];
}
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
function reduceFrac(num, den) { let g = gcd(num, den); return [num / g, den / g]; }
function fracHTML(num, den) { return '<span class="bunsuu"><span class="bunshi">' + num + '</span><span class="bunbo">' + den + '</span></span>'; }
function mixedHTML(whole, num, den) {
  if (num === 0) return String(whole);
  if (whole === 0) return fracHTML(num, den);
  return '<span class="taibunsuu">' + whole + fracHTML(num, den) + '</span>';
}
function roundToPlace(num, place) { return Math.round(num / place) * place; }
function factorial(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
function combination(n, r) { return factorial(n) / (factorial(r) * factorial(n - r)); }
function round2(num) { return Math.round(num * 100) / 100; }
function fmtNum(num) {
  if (Number.isInteger(num)) return String(num);
  return String(Math.round(num * 100) / 100);
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const NAMES = ["ゆうと", "はると", "そうた", "みなと", "りく", "かい", "こうき", "たいち", "いつき", "れん",
  "さくら", "ゆい", "みお", "あかり", "かえで", "めい", "つむぎ", "あおい", "ひなた", "なぎさ"];

const ITEMS = [
  { n: "りんご", c: "こ" }, { n: "みかん", c: "こ" }, { n: "いちご", c: "こ" }, { n: "もも", c: "こ" },
  { n: "おはじき", c: "こ" }, { n: "あめ", c: "こ" }, { n: "クッキー", c: "まい" }, { n: "おりがみ", c: "まい" },
  { n: "シール", c: "まい" }, { n: "色紙", c: "まい" }, { n: "えんぴつ", c: "本" }, { n: "色えんぴつ", c: "本" },
  { n: "花", c: "本" }, { n: "ジュース", c: "本" }, { n: "ノート", c: "さつ" }, { n: "図かん", c: "さつ" },
  { n: "ビー玉", c: "こ" }, { n: "風船", c: "こ" }, { n: "金魚", c: "ひき" }, { n: "うさぎ", c: "ひき" }
];
function pickItem() { return pick(ITEMS); }
const PLACES = ["こうえん", "がっこう", "としょかん", "たいいくかん", "ちょう内会館"];
const SHOPS = [
  { n: "ノート", c: "さつ" }, { n: "消しゴム", c: "こ" }, { n: "下じき", c: "まい" },
  { n: "色えんぴつ", c: "本" }, { n: "ふでばこ", c: "こ" }, { n: "クリアファイル", c: "まい" },
];
function pickShop() { return pick(SHOPS); }
const ANIMALS = [
  { n: "うさぎ", c: "ひき" }, { n: "にわとり", c: "わ" }, { n: "犬", c: "ひき" }, { n: "金魚", c: "ひき" }
];
function pickAnimal() { return pick(ANIMALS); }
const VEHICLES = ["自動車", "バス", "自転車", "トラック"];
const CONTAINERS = ["ふくろ", "はこ", "かご", "たば"];

/* ===== 学年1：たし算・ひき算の文パターン共有ヘルパー ===== */
function g1AddText(a, b, item, n1, n2) {
  return pick([
    n1 + "さんは" + item.n + "を" + a + item.c + "、" + n2 + "さんは" + item.n + "を" + b + item.c + "もっています。2人あわせて" + item.n + "は何" + item.c + "ですか。",
    pick(PLACES) + "に" + item.n + "が" + a + item.c + "ありました。あとから" + b + item.c + "もってきました。ぜんぶで何" + item.c + "になりましたか。",
    n1 + "さんは" + item.n + "を" + a + item.c + "もっていました。" + n2 + "さんから" + b + item.c + "もらいました。ぜんぶで何" + item.c + "になりましたか。",
    "はこの中に" + item.n + "が" + a + item.c + "入っていました。" + b + item.c + "つけくわえると、ぜんぶで何" + item.c + "になりますか。",
  ]);
}
function g1SubText(a, b, item, n1, n2) {
  return pick([
    pick(PLACES) + "に" + item.n + "が" + a + item.c + "ありました。" + b + item.c + "つかうと、のこりは何" + item.c + "ですか。",
    n1 + "さんは" + item.n + "を" + a + item.c + "もっていました。" + n2 + "さんに" + b + item.c + "あげました。のこりは何" + item.c + "ですか。",
    item.n + "が" + a + item.c + "ありました。" + b + item.c + "食べると、のこりは何" + item.c + "ですか。",
    n1 + "さんは" + item.n + "を" + a + item.c + "、" + n2 + "さんは" + item.n + "を" + b + item.c + "もっています。" + n1 + "さんは" + n2 + "さんより何" + item.c + "多くもっていますか。",
  ]);
}

/* ===== 学年ごとの単元定義 =====
   text: 問題文（HTML可）／ answerHTML: こたえ（HTML可）／ shiki: 式（解答用の参考、プレーンテキスト）
*/
const GRADE_UNITS = {
  1: [
    { id: "g1-add-nocarry", name: "たし算（くり上がりなし）", domain: "数と計算", gen: g1AddNoCarry },
    { id: "g1-add-carry", name: "たし算（くり上がりあり）", domain: "数と計算", gen: g1AddCarry },
    { id: "g1-sub-nocarry", name: "ひき算（くり下がりなし）", domain: "数と計算", gen: g1SubNoCarry },
    { id: "g1-sub-carry", name: "ひき算（くり下がりあり）", domain: "数と計算", gen: g1SubCarry },
    { id: "g1-three-numbers", name: "3つのかずのけいさん", domain: "数と計算", gen: g1ThreeNumbers },
  ],
  2: [
    { id: "g2-add-hissan", name: "たし算の筆算（2けた・3けた）", domain: "数と計算", gen: g2AddHissan },
    { id: "g2-sub-hissan", name: "ひき算の筆算（2けた・3けた）", domain: "数と計算", gen: g2SubHissan },
    { id: "g2-kakezan", name: "かけ算（九九）", domain: "数と計算", gen: g2Kakezan },
    { id: "g2-length", name: "長さ（cm・m）", domain: "量と測定", gen: g2Length },
    { id: "g2-kasa", name: "かさ（dL・L）", domain: "量と測定", gen: g2Kasa },
    { id: "g2-jikoku", name: "時こくと時間", domain: "量と測定", gen: g2Jikoku },
  ],
  3: [
    { id: "g3-kakezan-hissan", name: "かけ算の筆算（2〜3けた×1けた）", domain: "数と計算", gen: g3KakezanHissan },
    { id: "g3-warizan-noamari", name: "わり算（あまりなし）", domain: "数と計算", gen: g3WarizanNoAmari },
    { id: "g3-warizan-amari", name: "わり算（あまりあり）", domain: "数と計算", gen: g3WarizanAmari },
    { id: "g3-ookii-kazu", name: "大きい数", domain: "数と計算", gen: g3OokiiKazu },
    { id: "g3-shousuu", name: "小数のたし算・ひき算", domain: "数と計算", gen: g3Shousuu },
    { id: "g3-bunsuu", name: "分数（同分母）のたし算・ひき算", domain: "数と計算", gen: g3Bunsuu },
    { id: "g3-omosa", name: "重さ（g・kg）", domain: "量と測定", gen: g3Omosa },
    { id: "g3-jikan", name: "時間の計算（分・秒）", domain: "量と測定", gen: g3Jikan },
  ],
  4: [
    { id: "g4-warizan-hissan", name: "わり算の筆算（2けたでわる）", domain: "数と計算", gen: g4WarizanHissan },
    { id: "g4-kakudo", name: "角度", domain: "図形", gen: g4Kakudo },
    { id: "g4-gaisuu", name: "がい数（概数）", domain: "数と計算", gen: g4Gaisuu },
    { id: "g4-shousuu-kakewari", name: "小数のかけ算・わり算", domain: "数と計算", gen: g4ShousuuKakewari },
    { id: "g4-bunsuu", name: "分数のたし算・ひき算（帯分数）", domain: "数と計算", gen: g4Bunsuu },
    { id: "g4-menseki", name: "面積（長方形・正方形）", domain: "図形", gen: g4Menseki },
    { id: "g4-tanniatari", name: "単位量あたりの大きさ", domain: "数量関係", gen: g4TanniAtari },
  ],
  5: [
    { id: "g5-shousuu-kakewari", name: "小数のかけ算・わり算", domain: "数と計算", gen: g5ShousuuKakewari },
    { id: "g5-bunsuu-ihoubo", name: "分数のたし算・ひき算（異分母）", domain: "数と計算", gen: g5BunsuuIhoubo },
    { id: "g5-bunsuu-seisuu", name: "分数×整数・分数÷整数", domain: "数と計算", gen: g5BunsuuSeisuu },
    { id: "g5-wariai", name: "割合（百分率）", domain: "数量関係", gen: g5Wariai },
    { id: "g5-hayasa", name: "速さ", domain: "量と測定", gen: g5Hayasa },
    { id: "g5-tanniatari", name: "単位量あたりの大きさ", domain: "数量関係", gen: g5TanniAtari },
    { id: "g5-menseki", name: "図形の面積（三角形・平行四辺形）", domain: "図形", gen: g5Menseki },
    { id: "g5-taiseki", name: "体積（直方体・立方体）", domain: "量と測定", gen: g5Taiseki },
  ],
  6: [
    { id: "g6-bunsuu-kake", name: "分数×分数", domain: "数と計算", gen: g6BunsuuKake },
    { id: "g6-bunsuu-wari", name: "分数÷分数", domain: "数と計算", gen: g6BunsuuWari },
    { id: "g6-hi", name: "比", domain: "数量関係", gen: g6Hi },
    { id: "g6-kakudaizu", name: "拡大図・縮図", domain: "図形", gen: g6Kakudaizu },
    { id: "g6-en-menseki", name: "円の面積", domain: "図形", gen: g6EnMenseki },
    { id: "g6-kakuchuu-taiseki", name: "角柱・円柱の体積", domain: "図形", gen: g6KakuchuuTaiseki },
    { id: "g6-hirei", name: "比例", domain: "数量関係", gen: g6Hirei },
    { id: "g6-baainokazu", name: "場合の数", domain: "数量関係", gen: g6BaaiNoKazu },
  ],
};

/* ===== 学年1 ===== */
function g1AddNoCarry() {
  let a = ri(1, 8), b = ri(1, 9 - a);
  let item = pickItem();
  let [n1, n2] = pickTwoNames();
  let text = g1AddText(a, b, item, n1, n2);
  return { text, answerHTML: (a + b) + item.c, shiki: a + "+" + b + "=" + (a + b) };
}
function g1AddCarry() {
  let s = ri(11, 18);
  let a = ri(Math.max(2, s - 9), Math.min(9, s - 2));
  let b = s - a;
  let item = pickItem();
  let [n1, n2] = pickTwoNames();
  let text = g1AddText(a, b, item, n1, n2);
  return { text, answerHTML: s + item.c, shiki: a + "+" + b + "=" + s };
}
function g1SubNoCarry() {
  let a = ri(11, 19);
  let onesDigit = a % 10;
  let b = ri(1, Math.max(1, onesDigit));
  let item = pickItem();
  let [n1, n2] = pickTwoNames();
  let text = g1SubText(a, b, item, n1, n2);
  return { text, answerHTML: (a - b) + item.c, shiki: a + "-" + b + "=" + (a - b) };
}
function g1SubCarry() {
  let a = ri(11, 17);
  let onesDigit = a % 10;

  let html = "";
  for (let g = 1; g <= 6; g++) {
    html += '<label><input type="radio" name="grade" value="' + g + '"' + (g === 1 ? " checked" : "") + ' onchange="gradeChanged()"><span>' + g + '年生</span></label>';
  }
  row.innerHTML = html;
}

function currentGrade() {
  let el = document.querySelector('input[name="grade"]:checked');
  return el ? Number(el.value) : 1;
}

function gradeChanged() {
  renderUnitList();
}

function renderUnitList() {
  let grade = currentGrade();
  let units = GRADE_UNITS[grade];
  let container = document.getElementById("unit-list");
  let html = "";
  units.forEach(function (u) {
    let checked = selectedUnits[u.id] === true;
    html += '<label><input type="checkbox" data-unit-id="' + u.id + '" ' + (checked ? "checked" : "") + ' onchange="unitToggled(this)"> ' + u.name + '<span class="domain-tag">' + u.domain + '</span></label>';
  });
  container.innerHTML = html;
}

function unitToggled(el) {
  selectedUnits[el.getAttribute("data-unit-id")] = el.checked;
}

function unitAllToggle(value) {
  let grade = currentGrade();
  GRADE_UNITS[grade].forEach(function (u) { selectedUnits[u.id] = value; });
  renderUnitList();
}

let currentProblems = [];

function mondaiSakusei() {
  let grade = currentGrade();
  let units = GRADE_UNITS[grade].filter(function (u) { return selectedUnits[u.id] === true; });
  if (units.length === 0) {
    document.getElementById("title-hyouji").textContent = (document.getElementById("title").value || "文章問題プリント") + "（" + grade + "年生）";
    document.getElementById("mondai-list").innerHTML = '<p style="color:#888;">単元を選んで「文章題を作成する」ボタンを押してください。</p>';
    document.getElementById("overflow-warning").style.display = "none";
    return;
  }

  let count = Math.max(1, Math.min(30, Number(document.getElementById("mondaisu").value) || 10));
  let title = document.getElementById("title").value || "文章問題プリント";

  // 選んだ単元を均等に使うため、シャッフルした単元リストを繰り返し使う
  let order = [];
  let shuffled = units.slice().sort(function () { return Math.random() - 0.5; });
  for (let i = 0; i < count; i++) { order.push(shuffled[i % shuffled.length]); }

  document.getElementById("title-hyouji").textContent = title + "（" + grade + "年生）";
  currentProblems = order.map(function (unit) { return unit.gen(); });
  mondaiSaihyouji();
}

function mondaiSaihyouji() {
  if (currentProblems.length === 0) {
    document.getElementById("mondai-list").innerHTML = '<p style="color:#888;">単元を選んで「文章題を作成する」ボタンを押してください。</p>';
    document.getElementById("overflow-warning").style.display = "none";
    return;
  }
  let showAnswer = document.getElementById("showAnswer").checked;
  let html = "";
  currentProblems.forEach(function (q, idx) {
    let num = idx + 1;
    let shikiPart = showAnswer ? escapeHtml(q.shiki) : '<span class="blank-line blank-shiki">&nbsp;</span>';
    let kotaePart = showAnswer ? '<span class="kotae-fill">' + q.answerHTML + '</span>' : '<span class="blank-line blank-kotae">&nbsp;</span>';
    html += '<div class="q-block">'
      + '<p class="q-text"><span class="q-num">' + num + '.</span>' + q.text + '</p>'
      + '<p class="q-answer-row">しき（ ' + shikiPart + ' ）　　答え（ ' + kotaePart + ' ）</p>'
      + '</div>';
  });
  document.getElementById("mondai-list").innerHTML = html;
  hamidashiKakunin();
}

function fontSizeUpdate() {
  let size = document.getElementById("fontsize").value;
  document.getElementById("print-area").style.fontSize = size + "px";
  document.getElementById("fontsize-hyouji").textContent = size;
  hamidashiKakunin();
}

function hamidashiKakunin() {
  let frame = document.getElementById("a4-frame");
  let printArea = document.getElementById("print-area");
  let warning = document.getElementById("overflow-warning");
  if (!frame || !printArea || !warning) return;
  let motoNoCss = frame.style.cssText;
  frame.style.width = "auto";
  frame.style.aspectRatio = "auto";
  frame.style.height = "257mm";
  frame.style.overflow = "visible";
  frame.style.padding = "0";
  frame.style.margin = "0";
  let hamidashiteiru = printArea.scrollHeight > printArea.clientHeight + 2;
  frame.style.cssText = motoNoCss;
  warning.style.display = hamidashiteiru ? "block" : "none";
}

async function pdfHozon() {
  let taishou = document.getElementById("print-area");
  let canvas = await html2canvas(taishou, {
    backgroundColor: "#ffffff",
    scrollX: -window.scrollX,
    scrollY: -window.scrollY,
    windowWidth: document.documentElement.scrollWidth,
    windowHeight: document.documentElement.scrollHeight,
    scale: 2
  });
  let imgData = canvas.toDataURL("image/png");
  let jsPDFKurasu = window.jspdf.jsPDF;
  let pdf = new jsPDFKurasu({ orientation: "portrait", unit: "mm", format: "a4" });
  let pdfHaba = 210;
  let pdfTakasa = (canvas.height * pdfHaba) / canvas.width;
  if (pdfTakasa > 297) pdfTakasa = 297;
  pdf.addImage(imgData, "PNG", 0, 0, pdfHaba, pdfTakasa);
  pdf.save((document.getElementById("title").value || "文章問題プリント") + ".pdf");
}

initGradeRow();
renderUnitList();
mondaiSakusei();
</script>
</body>
