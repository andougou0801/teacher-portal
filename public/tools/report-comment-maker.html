  .hint{
    font-size:11px;
    color:#8a93a3;

    color:#3a4152;

<body>
<div class="wrap">
  <h1>📝 通知表所見文例集</h1>
  <p class="privacy-note">入力した名前や作成中の所見は、この端末のブラウザ内だけで処理されます（外部サーバーへの送信はありません）。お気に入り登録もこの端末にのみ保存されます。</p>

  <div class="card">
    <h2>1. 文例をさがす</h2>
    <div class="filter-row">
      <div>
        <label for="catSelect">カテゴリー</label>
        <select id="catSelect"></select>
      </div>
      <div id="subjectWrap" style="display:none;">
        <label for="subjectSelect">教科</label>
        <select id="subjectSelect"></select>
      </div>
    </div>
    <label for="searchInput">キーワード検索</label>
    <input type="search" id="searchInput" placeholder="例：協力、粘り強い、係活動 など">
    <div class="check-row">
      <input type="checkbox" id="favOnlyCheck">
      <label for="favOnlyCheck" style="margin:0;font-weight:400;">お気に入りのみ表示</label>
    </div>
    <p class="result-count" id="resultCount"></p>
    <div class="results-panel" id="resultsPanel"></div>
  </div>

  <div class="card">
    <h2>2. 作成中の所見</h2>
    <label for="nameInput">名前（入力すると文例中の「〇〇」が置き換わります）</label>
    <input type="text" id="nameInput" placeholder="例：山田 太郎">
    <p class="hint" style="margin-bottom:14px;">名前を変えても、選んだ文例そのものは保持されます。何度でも置き換えできます。</p>

    <label>選んだ文例（並べ替え・削除できます）</label>
    <div class="selected-list" id="selectedList"></div>
    <div class="empty-state" id="selectedEmpty">上の「＋ 追加」ボタンを押すと、ここに文例が追加されます。</div>

    <label for="previewArea" style="margin-top:6px;">プレビュー（コピーしてご利用ください）</label>
    <textarea id="previewArea" readonly placeholder="文例を追加するとここに反映されます"></textarea>
    <div class="btn-row">
      <button class="btn-sub" id="copyBtn">コピー</button>
      <button class="btn-sub btn-danger" id="clearBtn">全てクリア</button>
    </div>
    <p class="status-msg" id="statusMsg"></p>
  </div>
</div>

      try{
        var ok = document.execCommand('copy');
        if(ok) done(); else setStatus('コピーに失敗しました。テキストを選択して手動でコピーしてください。', true);
      }catch(e){
        setStatus('コピーに失敗しました。テキストを選択して手動でコピーしてください。', true);
      }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(fail);
    }else{
      fail();
    }
  });

  clearBtn.addEventListener('click', function(){
    selected = [];
    renderSelected();
    saveDraft();
    setStatus('作成中の所見をクリアしました。', false);
  });

  // ---------- 初期化 ----------
  (function init(){
    var draft = loadDraft();
    nameInput.value = draft.name || '';
    draft.ids.forEach(function(sourceId){
      var item = DATA.filter(function(d){ return d.id === sourceId; })[0];
      if(item) selected.push({ key: selKey++, sourceId: item.id, text: item.text });
    });
    renderResults();
    renderSelected();
  })();
})();
</script>
</body>
</html>
