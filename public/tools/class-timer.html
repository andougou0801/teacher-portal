<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>授業用タイマー</title>
<style>
  :root{
    --accent:#2d6cdf;
    --accent-dark:#1f54b8;
    --warn:#e8622c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(180deg,#f4f8ff 0%, #eef3fb 100%);
    color:#2a2a2a;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px 14px 60px;
    transition:background .4s;
  }
  body.time-up{
    background:linear-gradient(180deg,#fff3ee 0%, #ffe3d6 100%);
  }
  .wrap{max-width:480px;width:100%;}
  h1{
    text-align:center;
    font-size:20px;
    color:var(--accent-dark);
    margin:6px 0 20px;
  }
  .card{
    background:#fff;
    border-radius:20px;
    padding:24px 20px;
    box-shadow:0 4px 16px rgba(30,50,90,0.08);
    margin-bottom:16px;
  }
  .display{
    text-align:center;
    font-size:64px;
    font-weight:800;
    letter-spacing:2px;
    color:var(--accent-dark);
    font-variant-numeric:tabular-nums;
    margin:10px 0 18px;
    transition:color .3s;
  }
  body.time-up .display{color:var(--warn);}
  .progress-track{
    width:100%;
    height:10px;
    background:#e6ecf5;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-bar{
    height:100%;
    background:var(--accent);
    border-radius:10px;
    width:100%;
    transition:width 1s linear, background .3s;
  }
  body.time-up .progress-bar{background:var(--warn);}
  .controls{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:6px;
  }
  button{
    font-family:inherit;
    border:none;
    border-radius:14px;
    cursor:pointer;
  }
  .btn-main{
    background:var(--accent);
    color:#fff;
    font-size:16px;
    font-weight:800;
    padding:14px 28px;
    box-shadow:0 3px 8px rgba(45,108,223,0.3);
  }
  .btn-main:active{transform:scale(0.97);}
  .btn-main.pause{background:#f5a623;box-shadow:0 3px 8px rgba(245,166,35,0.3);}
  .btn-reset{
    background:#eef1f6;
    color:#555;
    font-size:14px;
    font-weight:700;
    padding:14px 20px;
  }
  .presets{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:16px;
  }
  .preset-btn{
    background:#eef4ff;
    color:var(--accent-dark);
    font-weight:700;
    font-size:14px;
    padding:12px 4px;
  }
  .preset-btn:active{transform:scale(0.96);}
  .custom-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:13px;
    color:#555;
  }
  .custom-row input{
    width:64px;
    padding:8px;
    border-radius:10px;
    border:1px solid #d8dfea;
    font-size:14px;
    text-align:center;
  }
  .custom-row button{
    background:#eef1f6;
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
    color:#333;
  }
  .status{
    text-align:center;
    font-size:14px;
    font-weight:700;
    color:var(--accent-dark);
    min-height:20px;
    margin-top:4px;
  }
  body.time-up .status{color:var(--warn);}
  .note{
    text-align:center;
    font-size:11px;
    color:#8a93a3;
    margin-top:10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>⏱ 授業用タイマー</h1>

  <div class="card">
    <div class="display" id="display">03:00</div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>

    <div class="presets">
      <button class="preset-btn" data-sec="60">1分</button>
      <button class="preset-btn" data-sec="180">3分</button>
      <button class="preset-btn" data-sec="300">5分</button>
      <button class="preset-btn" data-sec="600">10分</button>
    </div>

    <div class="custom-row" style="margin-bottom:16px;">
      <span>分 :</span>
      <input type="number" id="customMin" min="0" max="99" value="3">
      <span>秒 :</span>
      <input type="number" id="customSec" min="0" max="59" value="0">
      <button id="setCustom">セット</button>
    </div>

    <div class="controls">
      <button class="btn-main" id="startPauseBtn">スタート</button>
      <button class="btn-reset" id="resetBtn">リセット</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <p class="note">タイマー終了時に音と画面の色でお知らせします。</p>
</div>

<script>
  let totalSeconds = 180;
  let remaining = 180;
  let timerId = null;
  let running = false;

  const displayEl = document.getElementById('display');
  const progressBar = document.getElementById('progressBar');
  const startPauseBtn = document.getElementById('startPauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const statusEl = document.getElementById('status');

  function formatTime(sec){
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function render(){
    displayEl.textContent = formatTime(Math.max(remaining,0));
    const pct = totalSeconds > 0 ? Math.max(remaining,0) / totalSeconds * 100 : 0;
    progressBar.style.width = pct + '%';
  }

  function setDuration(sec){
    stopTimer();
    totalSeconds = sec;
    remaining = sec;
    document.body.classList.remove('time-up');
    statusEl.textContent = '';
    startPauseBtn.textContent = 'スタート';
    startPauseBtn.classList.remove('pause');
    render();
  }

  function playBeep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const beeps = [0, 0.35, 0.7];
      beeps.forEach((t) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.001, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.32);
      });
    }catch(e){ /* audio unavailable, ignore */ }
  }

  function tick(){
    remaining -= 1;
    if(remaining <= 0){
      remaining = 0;
      render();
      finishTimer();
      return;
    }
    render();
  }

  function startTimer(){
    if(remaining <= 0) return;
    running = true;
    startPauseBtn.textContent = 'いったん止める';
    startPauseBtn.classList.add('pause');
    statusEl.textContent = '';
    timerId = setInterval(tick, 1000);
  }

  function pauseTimer(){
    running = false;
    startPauseBtn.textContent = 'つづける';
    startPauseBtn.classList.remove('pause');
    clearInterval(timerId);
  }

  function stopTimer(){
    running = false;
    clearInterval(timerId);
  }

  function finishTimer(){
    stopTimer();
    document.body.classList.add('time-up');
    statusEl.textContent = 'タイムアップです！';
    startPauseBtn.textContent = 'スタート';
    startPauseBtn.classList.remove('pause');
    playBeep();
  }

  startPauseBtn.addEventListener('click', () => {
    if(document.body.classList.contains('time-up')){
      setDuration(totalSeconds);
      return;
    }
    if(running){
      pauseTimer();
    }else{
      startTimer();
    }
  });

  resetBtn.addEventListener('click', () => {
    setDuration(totalSeconds);
  });

  document.querySelectorAll('.preset-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const sec = parseInt(btn.dataset.sec, 10);
      document.getElementById('customMin').value = Math.floor(sec/60);
      document.getElementById('customSec').value = sec % 60;
      setDuration(sec);
    });
  });

  document.getElementById('setCustom').addEventListener('click', () => {
    const min = Math.max(0, parseInt(document.getElementById('customMin').value, 10) || 0);
    const sec = Math.max(0, Math.min(59, parseInt(document.getElementById('customSec').value, 10) || 0));
    const total = min * 60 + sec;
    if(total > 0){
      setDuration(total);
    }
  });

  render();
</script>
</body>
</html>
